<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getallen 1–256</title>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --dot-off: #ffffff; --dot-off-border: #d6d3d1;
    --dot-on: #dc2626; --accent: #1c1917; --accent-text: #ffffff; --row-hover: #f5f5f4;
    --row-priem: #f5f5f4; --row-priem-hover: #e7e5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --dot-off: #292524; --dot-off-border: #44403c;
      --dot-on: #ef4444; --accent: #f5f5f4; --accent-text: #0c0a09; --row-hover: #262220;
      --row-priem: #23201e; --row-priem-hover: #2e2a27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
    --border: #292524; --dot-off: #292524; --dot-off-border: #44403c;
    --dot-on: #ef4444; --accent: #f5f5f4; --accent-text: #0c0a09; --row-hover: #262220;
      --row-priem: #23201e; --row-priem-hover: #2e2a27;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 1500px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .filter { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  .filter button {
    border: 0; background: var(--surface); color: var(--text); padding: 8px 14px;
    font: inherit; cursor: pointer; border-right: 1px solid var(--border);
  }
  .filter button:last-child { border-right: 0; }
  .filter button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .count { color: var(--muted); margin-left: 12px; }
  .wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--surface); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr[data-priem="ja"] { background: var(--row-priem); }
  tbody tr[data-priem="ja"]:hover { background: var(--row-priem-hover); }
  tbody tr[data-priem="ja"] td:first-child { box-shadow: inset 2px 0 0 var(--muted); }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ja { color: var(--dot-on); font-weight: 600; }
  /* Witte bolletjes als herhalende achtergrond, alleen de rode als element */
  .dots {
    position: relative; height: 11px;
    background: radial-gradient(circle, var(--dot-off) 0 3.5px, var(--dot-off-border) 3.5px 4.5px, transparent 4.5px) 0 0 / 11px 11px repeat-x;
  }
  .dot { position: absolute; top: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--dot-on); }
  .dot.zacht { background: var(--muted); }
  .dot.as { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
  /* Aaneengesloten rode bolletjes vanaf rechts (som en aantal) */
  .fill {
    position: absolute; top: 0; right: 0; height: 11px;
    background: radial-gradient(circle, var(--dot-on) 0 4.5px, transparent 4.5px) right 0 top 0 / 11px 11px repeat-x;
  }
  .ind { display: flex; align-items: center; gap: 10px; }
  .ind .meer { color: var(--dot-on); font-size: 12px; min-width: 2.5em; text-align: right; }
  .ind .val { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
  .controls .filter { margin-bottom: 0; }
  .label { color: var(--muted); font-size: 12px; margin-right: 6px; }
</style>
</head>
<body>
<main>

        <th class="num">Getal</th><th>Priem</th><th>Priemfactoren</th><th class="num">Binair</th><th id="ind-kop"></th>

</main>
<script>
  function factors(n) {
    const f = [];
    for (let d = 2; d * d <= n; d++) while (n % d === 0) { f.push(d); n /= d; }
    if (n > 1) f.push(n);
    return f;
  }
  const N = 256;
  const PRIEMEN = [];
  for (let p = 2; p <= N; p++) if (factors(p).length === 1) PRIEMEN.push(p);

  const getallen = [];
  for (let n = 1; n <= N; n++) {
    const f = factors(n);
    const delers = [];
    for (let d = 1; d <= n; d++) if (n % d === 0) delers.push(d);
    getallen.push({ n, f, delers, uniek: [...new Set(f)], som: f.reduce((a, b) => a + b, 0) });
  }
  const maxSom = Math.max(...getallen.map(g => g.som));

  // Hulpgrootheden voor de complexe varianten
  const isPriem = n => n >= 2 && factors(n).length === 1;
  const n_ = n => getallen[n - 1];
  for (const g of getallen) {
    const n = g.n;
    g.pi = PRIEMEN.filter(p => p <= n).length;
    let q = n + 1; while (!isPriem(q)) q++;
    g.gat = q - n;
    g.moving = [0, 1, 2, 3, 4].filter(k => n - k >= 1).reduce((a, k) => a + n_(n - k).f.length, 0);
    g.goldbach = PRIEMEN.filter(p => p <= n - p && isPriem(n - p)).length;
    let c = n, stappen = 0; while (c !== 1) { c = c % 2 ? 3 * c + 1 : c / 2; stappen++; }
    g.collatz = stappen;
    g.phi = g.n === 1 ? 1 : g.uniek.reduce((a, p) => a / p * (p - 1), n);
    g.aliquot = g.delers.reduce((a, d) => a + d, 0) - n;
  }
  // Creatief: Fibonacci, cellulaire automaat, gulden snede
  const FIB = [1, 2]; while (FIB.at(-1) + FIB.at(-2) <= N) FIB.push(FIB.at(-1) + FIB.at(-2));
  const PHI = (1 + Math.sqrt(5)) / 2;
  let fibWoord = "0";  // morfisme 0 → 01, 1 → 0
  while (fibWoord.length < N) fibWoord = [...fibWoord].map(c => c === "0" ? "01" : "0").join("");
  const BREED = 2 * N + 60, MIDDEN = N + 30;
  const generaties = [new Uint8Array(BREED)]; generaties[0][MIDDEN] = 1;
  for (let i = 1; i < N; i++) {
    const vorige = generaties[i - 1], rij = new Uint8Array(BREED);
    for (let x = 1; x < BREED - 1; x++) rij[x] = vorige[x - 1] ^ (vorige[x] | vorige[x + 1]);
    generaties.push(rij);
  }
  for (const g of getallen) {
    const n = g.n;
    let rest = n; g.zeck = [];
    for (let i = FIB.length - 1; i >= 0; i--) if (FIB[i] <= rest) { g.zeck.push(i); rest -= FIB[i]; }
    g.fibdeel = []; let a = 0, b = 1 % n;
    for (let k = 1; k <= 50; k++) { [a, b] = [b, (a + b) % n]; if (a === 0) g.fibdeel.push(k); }
    let x = 0, y = 1 % n, periode = 0;
    do { [x, y] = [y, (x + y) % n]; periode++; } while (!(x === 0 && y === 1 % n));
    g.pisano = periode;
    g.gulden = Math.floor((n * PHI % 1) * 50);
    let c = n; g.baan = new Set([n]); while (c !== 1) { c = c % 2 ? 3 * c + 1 : c / 2; g.baan.add(c); }
    g.kwadraten = 0;
    for (let i = 0; 2 * i * i <= n; i++) { const j = Math.round(Math.sqrt(n - i * i)); if (j * j === n - i * i) g.kwadraten++; }
  }
  // Riemann: Z(t) via de Riemann–Siegel-formule, nulpunten ½ + iγ van ζ, en het expliciete formule-spoor
  const theta = t => t / 2 * Math.log(t / (2 * Math.PI)) - t / 2 - Math.PI / 8 + 1 / (48 * t) + 7 / (5760 * t ** 3);
  function zetaZ(t) {
    const a = Math.sqrt(t / (2 * Math.PI)), M = Math.floor(a), p = a - M, th = theta(t);
    let som = 0;
    for (let k = 1; k <= M; k++) som += Math.cos(th - t * Math.log(k)) / Math.sqrt(k);
    const c = Math.cos(2 * Math.PI * p) || 1e-9;
    return 2 * som + (M % 2 ? 1 : -1) * (t / (2 * Math.PI)) ** -0.25 * Math.cos(2 * Math.PI * (p * p - p - 1 / 16)) / c;
  }
  const NULLEN = [];  // γ van de eerste ~500 nulpunten, gevonden als tekenwisseling van Z
  for (let t = 10, z = zetaZ(t); t < 830; ) {
    const t2 = t + 0.02, z2 = zetaZ(t2);
    if (Math.sign(z2) !== Math.sign(z)) {
      let a = t, b = t2, za = z;
      for (let i = 0; i < 40; i++) { const m = (a + b) / 2, zm = zetaZ(m); if (Math.sign(zm) === Math.sign(za)) { a = m; za = zm; } else b = m; }
      NULLEN.push((a + b) / 2);
    }
    t = t2; z = z2;
  }
  // Sprong van ψ(x) rond n volgens de expliciete formule met de eerste K nulpunten
  function sprong(n, K) {
    const golf = (x, g) => { const f = g * Math.log(x); return 2 * Math.sqrt(x) * (0.5 * Math.cos(f) + g * Math.sin(f)) / (0.25 + g * g); };
    let s = 1;
    for (let k = 0; k < K; k++) s -= golf(n + 0.5, NULLEN[k]) - golf(n - 0.5, NULLEN[k]);
    return s;
  }
  const zeta = s => s === 2 ? Math.PI ** 2 / 6 : [...Array(2000).keys()].reduce((a, k) => a + (k + 1) ** -s, 0) + 2000 ** (1 - s) / (s - 1);
  const ZETA = [0, ...Array.from({ length: 80 }, (_, k) => zeta(k + 2))];  // ZETA[k] = ζ(k + 1)
  function li(x) { const l = Math.log(x); let s = 0.5772156649 + Math.log(l), t = 1; for (let k = 1; k < 80; k++) { t *= l / k; s += t / k; } return s; }
  function riemannR(x) { const l = Math.log(x); let s = 1, t = 1; for (let k = 1; k < 80; k++) { t *= l / k; s += t / (k * ZETA[k]); } return s; }
  const ggd = (a, b) => b ? ggd(b, a % b) : a;
  const MID = 25;  // positie (van rechts) van de nul-as bij staafjes naar links/rechts
  function staaf(v, titel, extra = {}) {
    const k = Math.max(-24, Math.min(24, Math.round(v))), posities = [];
    for (let i = 1; i <= Math.abs(k); i++) posities.push(k > 0 ? MID - i : MID + i);
    return { posities, titels: posities.map(() => titel), as: [MID], ...extra };
  }
  let mertens = 0, psi = 0;
  for (const g of getallen) {
    const n = g.n;
    g.mu = n === 1 ? 1 : g.uniek.length < g.f.length ? 0 : (g.f.length % 2 ? -1 : 1);
    mertens += g.mu; g.mertens = mertens;
    if (n > 1 && g.uniek.length === 1) psi += Math.log(g.uniek[0]);
    g.psi = psi;
    g.t = 10 + (n - 1) / 2; g.Z = zetaZ(g.t);
    g.stemmen = NULLEN.slice(0, 50).map(γ => Math.cos(γ * Math.log(n)) < 0);
    g.detector = n === 1 ? Array(50).fill(-1) : Array.from({ length: 50 }, (_, j) => sprong(n, 10 * (j + 1)));
    g.li = n > 1 ? li(n) - g.pi : null;
    g.R = n > 1 ? riemannR(n) - g.pi : null;
  }
  // Binair: flips, swaps, rotaties en rekenen zonder overdracht (XOR)
  const telBits = x => { let c = 0; for (; x; x >>= 1) c += x & 1; return c; };
  const graad = x => 31 - Math.clz32(x);
  const clRest = (a, b) => { while (a && graad(a) >= graad(b)) a ^= b << (graad(a) - graad(b)); return a; };
  const clMaal = (a, b) => { let r = 0; for (; b; b >>= 1, a <<= 1) if (b & 1) r ^= a; return r; };
  const BIT_PAREN = [];

  // Maximaal 50 bolletjes; rode bolletjes daarbuiten worden als "+k" getoond
  const MAX = 50, S = 11;
  function indicator(g, modus) {
    const m = MODI[modus], plekken = Math.min(m.plekken, MAX), breedte = plekken * S, r = m.rood(g);
    let binnen, waarde = "", buiten = 0;
    if (r.vul !== undefined) {
      const zichtbaar = Math.min(r.vul, plekken);
      buiten = r.vul - zichtbaar;
      binnen = zichtbaar ? `<span class="fill" style="width:${zichtbaar * S}px"></span>` : "";
      waarde = `<span class="val">${r.waarde ?? r.vul}</span>`;
    } else {
      const plek = pos => `left:${breedte - (pos + 1) * S + 1}px`;
      buiten = r.posities.filter(pos => pos >= plekken).length;
      binnen = (r.as || []).map(pos => `<span class="dot as" style="${plek(pos)}"></span>`).join("")
        + (r.zacht || []).filter(pos => pos >= 0 && pos < plekken).map(pos => `<span class="dot zacht" style="${plek(pos)}"></span>`).join("");
      binnen += r.posities.map((pos, i) => pos >= plekken ? "" :
        `<span class="dot" title="${r.titels[i]}" style="${plek(pos)}"></span>`).join("");
      if (r.waarde !== undefined) waarde = `<span class="val">${r.waarde}</span>`;
    }
    const meer = `<span class="meer">${buiten ? "+" + buiten : ""}</span>`;
    return `<div class="ind">${waarde}${meer}<div class="dots" style="width:${breedte}px">${binnen}</div></div>`;
  }

  const tbody = document.getElementById("rows");
  for (const g of getallen) {
    const priem = g.f.length === 1;
    const tr = document.createElement("tr");
    tr.dataset.priem = priem ? "ja" : "nee";
    tr.innerHTML = `
      <td class="num">${g.n}</td>
      <td class="${priem ? "ja" : ""}">${priem ? "ja" : "nee"}</td>
      <td>${g.f.length ? g.f.join(" × ") : "–"}</td>
      <td class="num mono">${g.n.toString(2)}</td>
      <td class="ind-cel"></td>`;
    tbody.appendChild(tr);
  }

  const filterKnoppen = document.querySelectorAll("#filter button");
  const modusKnoppen = document.querySelectorAll("[data-m]");

  function toonFilter(filter) {
    let shown = 0;
    for (const tr of tbody.rows) {
      const visible = filter === "alle" || tr.dataset.priem === filter;
      tr.hidden = !visible;
      if (visible) shown++;
    }
    filterKnoppen.forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));
    document.getElementById("count").textContent = `${shown} getallen`;
  }

  function toonModus(modus) {
    getallen.forEach((g, i) => { tbody.rows[i].cells[4].innerHTML = indicator(g, modus); });
    document.getElementById("ind-kop").textContent = MODI[modus].kop;
    document.getElementById("uitleg").textContent = MODI[modus].uitleg + " Maximaal 50 bolletjes; wat erbuiten valt staat als +k links ervan.";
    modusKnoppen.forEach(b => b.setAttribute("aria-pressed", b.dataset.m === modus));
  }

  filterKnoppen.forEach(b => b.addEventListener("click", () => toonFilter(b.dataset.f)));
  modusKnoppen.forEach(b => b.addEventListener("click", () => toonModus(b.dataset.m)));
  toonModus("priem");
  toonFilter("alle");
</script>
</body>
</html>
