<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getallen 1–256 · v6</title>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --dot-off: #ffffff; --dot-off-border: #d6d3d1;
    --dot-on: #dc2626; --accent: #1c1917; --accent-text: #ffffff; --row-hover: #f5f5f4;
    --row-priem: #f5f5f4; --row-priem-hover: #e7e5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --border: #292524; --dot-off: #292524; --dot-off-border: #44403c;
      --dot-on: #ef4444; --accent: #f5f5f4; --accent-text: #0c0a09; --row-hover: #262220;
      --row-priem: #23201e; --row-priem-hover: #2e2a27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
    --border: #292524; --dot-off: #292524; --dot-off-border: #44403c;
    --dot-on: #ef4444; --accent: #f5f5f4; --accent-text: #0c0a09; --row-hover: #262220;
    --row-priem: #23201e; --row-priem-hover: #2e2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 span { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 1100px; }
  .filter { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .filter button { border: 0; background: var(--surface); color: var(--text); padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; border-right: 1px solid var(--border); }
  .filter button:last-child { border-right: 0; }
  .filter button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .count { color: var(--muted); margin-left: 12px; }
  .wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--surface); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr[data-priem="ja"] { background: var(--row-priem); }
  tbody tr[data-priem="ja"]:hover { background: var(--row-priem-hover); }
  tbody tr[data-priem="ja"] td:first-child { box-shadow: inset 2px 0 0 var(--muted); }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ja { color: var(--dot-on); font-weight: 600; }
  .dots { position: relative; height: 11px; background: radial-gradient(circle, var(--dot-off) 0 3.5px, var(--dot-off-border) 3.5px 4.5px, transparent 4.5px) 0 0 / 11px 11px repeat-x; }
  .dot { position: absolute; top: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--dot-on); }
  .dot.zacht { background: var(--muted); }
  .dot.as { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
  .fill { position: absolute; top: 0; right: 0; height: 11px; background: radial-gradient(circle, var(--dot-on) 0 4.5px, transparent 4.5px) right 0 top 0 / 11px 11px repeat-x; }
  .ind { display: flex; align-items: center; gap: 10px; }
  .ind .meer { color: var(--dot-on); font-size: 12px; min-width: 2.5em; text-align: right; }
  .ind .val { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  .controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .controls > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .label { color: var(--muted); font-size: 12px; min-width: 150px; }
</style>
</head>
<body>
<main>
  <h1>Getallen 1–256 <span>v6 · honderd lenzen</span></h1>
  <p class="sub" id="uitleg"></p>
  <div class="controls" id="controls">
    <div>
      <span class="label">Priem</span>
      <div class="filter" id="filter" role="group" aria-label="Filter op priem">
        <button data-f="alle" aria-pressed="true">Alle</button>
        <button data-f="ja" aria-pressed="false">Ja</button>
        <button data-f="nee" aria-pressed="false">Nee</button>
      </div>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr><th class="num">n</th><th>priem</th><th>priemfactoren</th><th>binair</th><th id="ind-kop"></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
  // ---------- basis ----------
  const N = 256, GRENS = 70000;
  const ZEEF = new Uint8Array(GRENS + 1).fill(1); ZEEF[0] = ZEEF[1] = 0;
  for (let p = 2; p * p <= GRENS; p++) if (ZEEF[p]) for (let m = p * p; m <= GRENS; m += p) ZEEF[m] = 0;
  function factors(n) { const f = []; for (let d = 2; d * d <= n; d++) while (n % d === 0) { f.push(d); n /= d; } if (n > 1) f.push(n); return f; }
  const BASES = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
  const bigMacht = (a, e, m) => { let r = 1n; a %= m; for (; e; e >>= 1n, a = a * a % m) if (e & 1n) r = r * a % m; return r; };
  function bigPriem(n) {  // Miller–Rabin met 12 grondtallen: exact onder 3·10²⁴, daarboven PRP
    if (n < 2n) return false;
    for (const p of BASES) { if (n === p) return true; if (n % p === 0n) return false; }
    for (let q = 41n; q < 1000n; q += 2n) if (n % q === 0n) return n === q;
    let d = n - 1n, s = 0; while (!(d & 1n)) { d >>= 1n; s++; }
    return BASES.every(a => { let x = bigMacht(a, d, n); if (x === 1n || x === n - 1n) return true; for (let i = 1; i < s; i++) { x = x * x % n; if (x === n - 1n) return true; } return false; });
  }
  const isPriem = n => n <= GRENS ? n >= 2 && ZEEF[n] === 1 : typeof n === "bigint" ? bigPriem(n) : n < 1e12 ? factors(n).length === 1 : bigPriem(BigInt(n));
  const ggd = (a, b) => b ? ggd(b, a % b) : a;
  const powmod = (a, e, m) => { let r = 1; a %= m; if (a < 0) a += m; for (; e; e >>= 1, a = a * a % m) if (e & 1) r = r * a % m; return r; };
  const jacobi = (a, n) => { a = ((a % n) + n) % n; let r = 1; while (a) { while (a % 2 === 0) { a /= 2; if (n % 8 === 3 || n % 8 === 5) r = -r; } [a, n] = [n, a]; if (a % 4 === 3 && n % 4 === 3) r = -r; a %= n; } return n === 1 ? r : 0; };
  const nietRest = n => { for (let a = 2; a < n; a++) if (jacobi(a, n) === -1) return a; return 0; };
  const legendre = (a, p) => { a = ((a % p) + p) % p; return a === 0 ? 0 : powmod(a, (p - 1) / 2, p) === 1 ? 1 : -1; };
  const ordMod = (a, m) => { if (m === 1) return 1; a = ((a % m) + m) % m; if (ggd(a, m) !== 1) return 0; let x = a, k = 1; while (x !== 1) { x = x * a % m; k++; } return k; };
  const PR = []; for (let p = 2; p <= 3000; p++) if (ZEEF[p]) PR.push(p);
  const PRIEMEN = PR.filter(p => p <= N), P50 = PR.slice(0, 50);
  const PI = new Int32Array(GRENS + 1); for (let k = 1, c = 0; k <= GRENS; k++) { if (ZEEF[k]) c++; PI[k] = c; }
  const volgende = x => { let q = x + 1; while (!isPriem(q)) q++; return q; };
  const vorige = x => { let q = x - 1; while (q > 1 && !isPriem(q)) q--; return q; };
  const cijfersom = x => [...String(x)].reduce((s, c) => s + +c, 0);
  const omkeer = x => +[...String(x)].reverse().join("");
  const cijfersBasis = (x, b) => { const d = []; while (x) { d.unshift(x % b); x = Math.floor(x / b); } return d; };
  const isKwadraat = x => x >= 0 && Number.isInteger(Math.sqrt(x));
  const EG = Math.exp(0.5772156649);
  const getallen = [];
  for (let n = 1; n <= N; n++) { const f = factors(n); getallen.push({ n, f, uniek: [...new Set(f)], phi: n === 1 ? 1 : [...new Set(f)].reduce((a, p) => a / p * (p - 1), n), sigma: [...Array(n).keys()].filter(d => n % (d + 1) === 0).reduce((a, d) => a + d + 1, 0) }); }
  const n_ = n => getallen[n - 1];
  // cumulatieve grootheden
  { let rowland = 7, som1p = 0, prod = 1, theta = 0, brun = 0, somP = 0; const r3 = [0, 0];
    for (const g of getallen) { const n = g.n; if (n >= 2) { const d = ggd(n, rowland); rowland += d; g.rowlandD = d; } g.rowland = rowland;
      if (isPriem(n)) { som1p += 1 / n; prod *= 1 - 1 / n; theta += Math.log(n); somP += n; if (n > 3) r3[n % 3 - 1]++; if (isPriem(n + 2)) brun += 1 / n + 1 / (n + 2); }
      g.som1p = som1p; g.prod = prod; g.theta = theta; g.brun = brun; g.somP = somP; g.race3 = r3[1] - r3[0]; } }
  const MID = 25;
  const staaf = (v, titel, extra = {}) => { const k = Math.max(-24, Math.min(24, Math.round(v))), posities = []; for (let i = 1; i <= Math.abs(k); i++) posities.push(k > 0 ? MID - i : MID + i); return { posities, titels: posities.map(() => titel), as: [MID], ...extra }; };
  // Rijen: cellen[k] = [soort, titel] met soort "r" (rood), "z" (grijs), "o" (open rondje) of "" (leeg); positie 0 staat rechts
  const rij = (cellen, waarde) => { const r = { posities: [], titels: [], zacht: [], as: [], waarde }; cellen.forEach(([s, t], k) => { if (s === "r") { r.posities.push(k); r.titels.push(t ?? ""); } else if (s === "z") r.zacht.push(k); else if (s === "o") r.as.push(k); }); return r; };
  const venster = (f, waarde) => g => rij([...Array(50).keys()].map(k => g.n - k >= 1 ? f(g.n - k, g) : [""]), waarde ? waarde(g) : undefined);  // k = 0 is n zelf (rechts), k = 49 is n − 49
  const vooruit = (f, waarde) => g => rij([...Array(50).keys()].map(k => f(g.n + k, g)), waarde ? waarde(g) : undefined);  // n … n + 49
  const plekken = (lo, f, waarde) => g => rij([...Array(50).keys()].map(k => f(lo + k, g)), waarde ? waarde(g) : undefined);  // k = lo … lo + 49
  const overPriemen = (f, waarde) => g => rij(P50.map(q => f(q, g)), waarde ? waarde(g) : undefined);  // de 50 priemen 2 … 229
  const vul = (f, waarde) => g => ({ vul: Math.max(0, Math.round(f(g))), waarde: waarde ? waarde(g) : undefined });
  const P = (x, t) => [isPriem(x) ? "r" : "", t ?? `${x}`];

  // ---------- rekenhulpjes voor bepaalde lenzen ----------
  const fibMod = (k, m) => { let a = 0, b = 1 % m; for (let i = 0; i < k; i++) [a, b] = [b, (a + b) % m]; return a; };
  const lucasMod = (k, m) => { let a = 2 % m, b = 1 % m; for (let i = 0; i < k; i++) [a, b] = [b, (a + b) % m]; return a; };
  const perrinMod = (k, m) => { let a = 3 % m, b = 0, c = 2 % m; for (let i = 0; i < k; i++) [a, b, c] = [b, c, (a + b) % m]; return a; };
  const facMod = (k, m) => { let f = 1 % m; for (let i = 2; i <= k; i++) f = f * i % m; return f; };
  const kempner = n => { if (n === 1) return 1; let f = 1; for (let m = 1; ; m++) { f = f * m % n; if (f === 0) return m; } };
  const sterkTest = (a, n) => { let d = n - 1, s = 0; while (d % 2 === 0) { d /= 2; s++; } let x = powmod(a, d, n); if (x === 1 || x === n - 1) return true; for (let r = 1; r < s; r++) { x = x * x % n; if (x === n - 1) return true; } return false; };
  const SYLVESTER = [2n]; for (let i = 0; i < 9; i++) SYLVESTER.push(SYLVESTER[i] * SYLVESTER[i] - SYLVESTER[i] + 1n);
  const GELUKKIG = (() => { let L = []; for (let i = 1; i <= N + 50; i += 2) L.push(i); for (let k = 1; k < L.length && L[k] <= L.length; k++) { const s = L[k]; L = L.filter((_, i) => (i + 1) % s); } return new Set(L); })();
  const fac = n => { let f = 1n; for (let k = 2n; k <= BigInt(n); k++) f *= k; return f; };
  const FAC = [1n]; for (let k = 1; k <= 80; k++) FAC[k] = FAC[k - 1] * BigInt(k);
  const dressLandreau = x => { const X = BigInt(x); const T = X ** 6n - 15n * X ** 5n - 1493n * X ** 4n + 9243n * X ** 3n + 401884n * X ** 2n - 143652n * X - 4128984n; return T % 72n ? null : (T < 0n ? -T : T) / 72n; };
  const P1230 = x => 5 * x ** 4 - 330 * x ** 3 + 9395 * x ** 2 - 130510 * x + 709337;
  const HL_E = (() => { const C = 1.3728134628; let s = 0; const out = [0, 0]; for (let t = 2; t <= N; t++) { s += C / Math.log(t * t + 1); out[t] = s; } return out; })();
  const eersteGat = {}; for (let i = 1; i < PR.length; i++) { const d = PR[i] - PR[i - 1]; if (!(d in eersteGat)) eersteGat[d] = PR[i - 1]; }
  const kleinsteGetuige = n => { for (let a = 2; a < n; a++) if (!sterkTest(a, n)) return a; return 0; };
  const patroon = n => { const Q = d => isPriem(n + d); const lijst = [["zesling", [4, 6, 10, 12, 16]], ["vijfling", [2, 6, 8, 12]], ["vijfling", [4, 6, 10, 12]], ["vierling", [2, 6, 8]], ["drieling", [2, 6]], ["drieling", [4, 6]], ["tweeling", [2]], ["neven", [4]], ["sexy", [6]]]; const r = isPriem(n) ? lijst.find(([, d]) => d.every(Q)) : null; return r ? `${r[0]} (0, ${r[1].join(", ")})` : isPriem(n) ? "los" : ""; };
  const repunitMod = (n, q) => q === 3 ? n % 3 : (powmod(10, n, q) - 1 + q) % q * powmod(9, q - 2, q) % q;  // R_n mod q, q priem ≠ 3
  const kleinstePriemIn = (a, m) => { for (let x = a; x < m * m + m; x += m) if (isPriem(x)) return x; return 0; };

  // ---------- de honderd lenzen ----------
  const GROEPEN = [];
  const groep = (naam, lenzen) => GROEPEN.push([naam, lenzen]);
  const MODI = {};
  const lens = (id, kop, uitleg, plekkenAantal, rood) => { MODI[id] = { kop, uitleg, plekken: plekkenAantal, rood }; return id; };

  groep("Resten", [
    lens("mod6", "Venster n … n−49: rood = priem ≡ 1 (mod 6), grijs = priem ≡ 5 (mod 6)", "Feit 1101: elke priem boven 3 is 6k ± 1. Rood = rest 1, grijs = rest 5; 2 en 3 blijven wit. De twee soorten wisselen elkaar onregelmatig af, en lange reeksen van één soort (feit 4024) zijn zeldzaam: hier hoogstens drie op rij. Rechts de rest van n zelf.", 50, venster((x, g) => [isPriem(x) ? (x % 6 === 1 ? "r" : x % 6 === 5 ? "z" : "") : "", `${x} ≡ ${x % 6} (mod 6)`], g => isPriem(g.n) ? `${g.n % 6} (mod 6)` : "")),
    lens("gat6", "Gat na priem n (rood); de rest van het gat mod 6 staat vast: 2 bij n ≡ 5, 4 bij n ≡ 1, of 0", "Feit 1108: voor p > 3 is het gat naar de volgende priem ≡ 0 (mod 6), of ≡ 2 precies als p ≡ 5 (mod 6), of ≡ 4 precies als p ≡ 1 (mod 6). Het gat kan dus nooit 'van soort wisselen': na 5 mod 6 komt 2, 8, 14 of een zesvoud. Het aantal rode bolletjes is het gat; rechts het gat en zijn rest mod 6.", 50, vul(g => isPriem(g.n) ? volgende(g.n) - g.n : 0, g => isPriem(g.n) ? `${volgende(g.n) - g.n} ≡ ${(volgende(g.n) - g.n) % 6} (mod 6)` : "")),
    lens("mod24", "Welke m = 2 … 51 delen n² − 1? (m = 51 … 2); rood = ja", "Feit 1104: p² ≡ 1 (mod 24) voor elke priem p > 3, en 24 is de grootste modulus waarvoor dat voor álle zulke p geldt. Rood = m deelt n² − 1. Bij priemen boven 3 zijn 2, 3, 4, 6, 8, 12 en 24 altijd rood (en 48 nooit voor alle); het bolletje van 24 is dus een priemfilter. Rechts ggd(n² − 1, 240).", 50, plekken(2, (m, g) => [(g.n * g.n - 1) % m === 0 ? "r" : "", `${m} deelt ${g.n}² − 1`], g => ggd(g.n * g.n - 1, 240))),
    lens("mod240", "Welke m = 2 … 51 delen n⁴ − 1? rood = ja", "Feit 1105: p⁴ ≡ 1 (mod 240) voor p > 5, p⁶ ≡ 1 (mod 504) en p⁸ ≡ 1 (mod 480), telkens de grootste modulus. De regel: de grootste m met pᵏ ≡ 1 voor alle p ∤ m is het product over q van de hoogste q-macht waarvan de groep (ℤ/qᵃ)* exponent deelt k. Rood = m deelt n⁴ − 1; bij priemen boven 5 zijn alle delers van 240 tot 51 rood: 2, 3, 4, 5, 6, 8, 10, 12, 15, 16, 20, 24, 30, 40, 48. Rechts ggd(n⁴ − 1, 240).", 50, plekken(2, (m, g) => [(g.n ** 4 - 1) % m === 0 ? "r" : "", `${m} deelt ${g.n}⁴ − 1`], g => ggd(g.n ** 4 - 1, 240))),
    lens("tweeling6", "Venster: rood = onderste van een tweeling (p, p + 2), grijs = veelvoud van 6 ertussen", "Feit 1109: tweelingpriemen boven 3 zijn 6k − 1 en 6k + 1, met het zesvoud ertussen (grijs), en hun som is deelbaar door 12. (3, 5, 7) is de enige priemdrieling p, p + 2, p + 4, want een van de drie is deelbaar door 3. Rechts hoeveel tweelingen er in het venster beginnen.", 50, venster(x => [isPriem(x) && isPriem(x + 2) ? "r" : isPriem(x - 1) && isPriem(x + 1) ? "z" : "", isPriem(x) && isPriem(x + 2) ? `${x}, ${x + 2}` : `${x} = (${x - 1} + ${x + 1})/2`], g => [...Array(50).keys()].filter(k => g.n - k >= 2 && isPriem(g.n - k) && isPriem(g.n - k + 2)).length)),
    lens("germain", "Venster: rood = Sophie Germain-priem (2p + 1 ook priem), grijs = veilige priem ((p − 1)/2 priem)", "Feit 1110: Sophie Germain-priemen boven 3 zijn ≡ 5 (mod 6), en hun veilige priemen 2p + 1 zijn ≡ 11 (mod 12). Rood = p met 2p + 1 priem (2, 3, 5, 11, 23, 29, 41, 53, 83, 89, 113, 131, 173, 179, 191, 233, 239, 251), grijs = veilige priem (5, 7, 11, 23, 47, 59, 83, 107, 167, 179, 227), en 5, 11, 23, 83, 179 zijn allebei. Een keten p, 2p + 1, 4p + 3, … is een Cunningham-keten (feit 6201). Rechts wat n is.", 50, venster(x => [isPriem(x) && isPriem(2 * x + 1) ? "r" : isPriem(x) && x > 2 && isPriem((x - 1) / 2) ? "z" : "", `${x} → ${2 * x + 1}`], g => isPriem(g.n) ? (isPriem(2 * g.n + 1) ? "Sophie Germain" : "") + (g.n > 2 && isPriem((g.n - 1) / 2) ? " veilig" : "") : "")),
    lens("repunit", "n deelt de repunit R_k = 11…1 (k enen), k = 50 … 1; rood = ja", "Feit 1111: elke priem behalve 2, 3 en 5 deelt R_(p−1) = (10^(p−1) − 1)/9, en de kleinste k met p | R_k is de periode van 1/p, een deler van p − 1. Rood = n deelt R_k. Voor 3 en 9 gaat het om de cijfersom (3 | R₃, 9 | R₉); 11 deelt R₂, R₄, …; 37 deelt R₃; 101 deelt R₄. Rechts de kleinste k (– als n een factor 2 of 5 heeft).", 50, plekken(1, (k, g) => { const n = g.n; if (n % 2 === 0 || n % 5 === 0) return [""]; let r = 0; for (let i = 0; i < k; i++) r = (r * 10 + 1) % n; return [r === 0 ? "r" : "", `R_${k} ≡ 0 (mod ${n})`]; }, g => { const n = g.n; if (n % 2 === 0 || n % 5 === 0) return "–"; for (let k = 1, r = 0; k <= 10000; k++) { r = (r * 10 + 1) % n; if (r === 0) return k; } return "?"; })),
    lens("kwadraatplus1", "Venster: rood = k² + 1 is priem (k = n … n−49); rechts het laatste cijfer van n² + 1", "Feit 1112: is k² + 1 > 5 priem, dan is k even en eindigt k² + 1 op 1 of 7. Oneven k geven een even getal, en k ≡ ±2 (mod 5) geeft 5 | k² + 1. Rood = k² + 1 priem; die rode bolletjes staan daarom altijd op even k, dus om de andere plek. Feit 5007: tot 10⁶ zijn er 54110 zulke k; of het er oneindig veel zijn is open (Landaus vierde probleem). Rechts n² + 1 en zijn laatste cijfer.", 50, venster(x => [isPriem(x * x + 1) ? "r" : "", `${x}² + 1 = ${x * x + 1}`], g => `${g.n * g.n + 1} → ${(g.n * g.n + 1) % 10}`)),
    lens("palindroom11", "Het palindroom n gevolgd door n achterstevoren: welke priemen q ≤ 229 delen het? (rood)", "Feit 1113: elk palindroom met een even aantal cijfers is deelbaar door 11, want 10 ≡ −1 (mod 11) en de cijfers heffen elkaar paarsgewijs op. Daarom is 11 de enige palindroompriem met een even aantal cijfers. Hier het palindroom n‖rev(n): 12 → 1221 = 3 · 11 · 37. Het bolletje van 11 is altijd rood; rechts het palindroom en zijn kleinste priemfactor.", 50, overPriemen((q, g) => { const s = String(g.n), v = +(s + [...s].reverse().join("")); return [v % q === 0 ? "r" : "", `${q} deelt ${v}`]; }, g => { const s = String(g.n), v = +(s + [...s].reverse().join("")); return `${v} = ${factors(v).join("·")}`; })),
    lens("cijfersom3", "Venster: rood = priem; grijs = cijfersom deelbaar door 3 (nooit allebei boven 3)", "Feit 1103: een priem boven 5 eindigt op 1, 3, 7 of 9, en boven 3 is zijn cijfersom niet deelbaar door 3 (want dan deelt 3 het getal). Rood en grijs sluiten elkaar dus uit, op 3 zelf na. Rechts de cijfersom van n en het laatste cijfer.", 50, venster(x => [isPriem(x) ? "r" : cijfersom(x) % 3 === 0 ? "z" : "", `${x}: cijfersom ${cijfersom(x)}`], g => `som ${cijfersom(g.n)} · eindigt op ${g.n % 10}`)),
  ]);

  groep("Fermat, Wilson en vrienden", [
    lens("fermat", "a^n ≡ a (mod n) voor a = 50 … 1; rood = ja", "Feit 1201 (Fermat): voor priem p geldt aᵖ ≡ a (mod p) voor élke a, dus een priemrij is helemaal rood. Een samengesteld getal faalt voor de meeste a; faalt het voor geen enkele a, dan is het een Carmichael-getal (561 is het kleinste, feit 6103). 341 = 11 · 31 slaagt voor a = 2 maar niet voor a = 3. Rechts het aantal grondtallen a < n dat slaagt, en of dat alle zijn.", 50, plekken(1, (a, g) => [powmod(a, g.n, g.n) === a % g.n ? "r" : "", `${a}^${g.n} ≡ ${a} (mod ${g.n})`], g => { const c = [...Array(Math.min(g.n - 1, 50)).keys()].filter(k => powmod(k + 1, g.n, g.n) === (k + 1) % g.n).length; return `${c} van ${Math.min(g.n - 1, 50)}`; })),
    lens("wilson", "k! mod n voor k = 50 … 1: rood = k! ≡ −1, grijs = k! ≡ 0, open = k! ≡ 1", "Feit 1202 (Wilson): (n − 1)! ≡ −1 (mod n) precies als n priem is. Rood = k! ≡ −1 (mod n): bij een priem p staat dat bolletje op k = p − 1, en soms eerder (feit 6221: Pillai-priemen zoals 23 hebben zo'n k met p ≢ 1 (mod k)). Grijs = k! ≡ 0: bij een samengesteld n gebeurt dat al vóór n − 1 (behalve bij 4), en daarna blijft het 0. Rechts (n − 1)! mod n.", 50, plekken(1, (k, g) => { const f = facMod(k, g.n); return [f === g.n - 1 && g.n > 2 ? "r" : f === 0 ? "z" : f === 1 % g.n ? "o" : "", `${k}! ≡ ${f} (mod ${g.n})`]; }, g => g.n > 1 ? facMod(g.n - 1, g.n) : "–")),
    lens("halffac", "((p − 1)/2)! mod p als rode bolletjes; rechts het kwadraat ervan: +1 of −1", "Feit 1203: ((p−1)/2)!² ≡ (−1)^((p+1)/2) (mod p). Voor p ≡ 1 (mod 4) is x = ((p−1)/2)! dus een expliciete wortel van −1 mod p: bij 13 is 6! = 720 ≡ 5 en 5² = 25 ≡ −1. Voor p ≡ 3 (mod 4) is het kwadraat +1, dus x ≡ ±1. Het aantal rode bolletjes is x mod p (met +k als het boven 50 komt); rechts x en x² mod p.", 50, vul(g => isPriem(g.n) && g.n > 2 ? facMod((g.n - 1) / 2, g.n) : 0, g => { if (!isPriem(g.n) || g.n < 3) return ""; const x = facMod((g.n - 1) / 2, g.n); return `x = ${x}, x² ≡ ${x * x % g.n === g.n - 1 ? "−1" : "+1"}`; })),
    lens("wolstenholme", "Harmonische sommen H_k = 1 + ½ + … + 1/k mod p (k = 50 … 1): rood = H_k ≡ 0 (mod p)", "Feit 1204 (Wolstenholme 1862): voor p ≥ 5 is de teller van H_(p−1) deelbaar door p², en C(2p − 1, p − 1) ≡ 1 (mod p³). Rood = de partiële som H_k is 0 mod p; bij k = p − 1 is dat altijd zo (en zelfs mod p²), maar tussendoor gebeurt het zelden. Alleen 16843 en 2124679 halen het mod p⁴ (Wolstenholme-priemen). Rechts H_(p−1) mod p², berekend met inversen mod p².", 50, plekken(1, (k, g) => { const p = g.n; if (!isPriem(p) || k >= p) return [""]; let s = 0; for (let i = 1; i <= k; i++) s = (s + powmod(i, p - 2, p)) % p; return [s === 0 ? "r" : "", `H_${k} ≡ ${s} (mod ${p})`]; }, g => { const p = g.n; if (!isPriem(p) || p < 3) return "–"; const m = p * p; let s = 0; for (let i = 1; i < p; i++) s = (s + powmod(i, p * (p - 1) - 1, m)) % m; return `H_${p - 1} ≡ ${s} (mod ${m})`; })),
    lens("lucas5", "Lucas: C(n, k) mod 5 ≠ 0 (rood) voor k = 49 … 0; dat is zo precies als elk 5-tallig cijfer van k ≤ dat van n", "Feit 1205 (Lucas 1878): C(n, k) ≡ ∏ C(nᵢ, kᵢ) (mod p) met nᵢ, kᵢ de cijfers in basis p. Rood = 5 deelt C(n, k) niet, dus elk cijfer van k in basis 5 is hoogstens het cijfer van n. Bij n = 24 = (44)₅ is alles tot 24 rood; bij n = 25 = (100)₅ alleen k = 0 en 25. Rechts n in basis 5 en het aantal k ≤ n met 5 ∤ C(n, k): het product van (nᵢ + 1).", 50, plekken(0, (k, g) => { let a = g.n, b = k, ok = true; while (b) { if (b % 5 > a % 5) { ok = false; break; } a = Math.floor(a / 5); b = Math.floor(b / 5); } return [k <= g.n && ok ? "r" : "", `C(${g.n}, ${k})`]; }, g => { let a = g.n, t = 1; while (a) { t *= a % 5 + 1; a = Math.floor(a / 5); } return `(${g.n.toString(5)})₅ · ${t} niet-nullen`; })),
    lens("fibonacci", "n deelt F_k (k = 50 … 1); open rondje bij k = p − (p/5): daar moet een priem p delen", "Feit 1206: F_p ≡ (p/5) (mod p) en p | F_(p − (p/5)) voor p ≠ 2, 5. Dus 11 deelt F₁₀ = 55, 13 deelt F₁₄ = 377, 7 deelt F₈ = 21. Rood = n deelt F_k; de rode bolletjes staan op een vaste afstand (de rang van n). Het open rondje staat op p − (p/5) en is bij priemen altijd rood. Een samengesteld getal kan ook zo'n open rondje 'raken': dat zijn Fibonacci-pseudopriemen (323 is de eerste, feit 6106). Rechts de rang.", 50, plekken(1, (k, g) => { const n = g.n, l = isPriem(n) && n !== 5 && n !== 2 ? n - legendre(n % 5, 5) * (n % 5 === 0 ? 0 : 1) : 0; const f = fibMod(k, n) === 0; return [f ? "r" : k === l ? "o" : "", `F_${k} ≡ 0 (mod ${n})`]; }, g => { for (let k = 1; k <= 2000; k++) if (fibMod(k, g.n) === 0) return `rang ${k}`; return "?"; })),
    lens("fermatquot", "Fermat-quotiënt (2^(p−1) − 1)/p mod p als rode bolletjes; 0 zou een Wieferich-priem zijn", "Feit 1207: 2^(p−1) ≡ 1 (mod p) altijd, maar mod p² bijna nooit: alleen 1093 en 3511 onder 10⁷ (Wieferich-priemen). Het quotiënt q = (2^(p−1) − 1)/p mod p is het aantal rode bolletjes (+k boven 50): het is 0 precies bij een Wieferich-priem, en hier nooit. Zo'n priem zou in Fermats laatste stelling een rol spelen (Wieferich 1909). Rechts q, en voor grondtal 3 ook (feit 1211: 11 is Wieferich voor grondtal 3).", 50, vul(g => { const p = g.n; if (!isPriem(p) || p < 3) return 0; return (powmod(2, p - 1, p * p) - 1) / p; }, g => { const p = g.n; if (!isPriem(p) || p < 5) return ""; return `q₂ = ${(powmod(2, p - 1, p * p) - 1) / p} · q₃ = ${(powmod(3, p - 1, p * p) - 1) / p}`; })),
    lens("clement", "Clement: 4((n − 1)! + 1) + n mod n(n + 2), geschaald naar 50 bolletjes; 0 = tweeling", "Feit 1209 (Clement 1949): (n, n + 2) zijn tweelingpriemen precies als 4((n − 1)! + 1) + n ≡ 0 (mod n(n + 2)). Het aantal rode bolletjes is die rest, geschaald naar 50; een tweeling geeft dus een lege rij (✓). Het is Wilson tweemaal tegelijk: (n − 1)! ≡ −1 mod n en 2(n − 1)! ≡ −1 … mod n + 2. Rechts de rest zelf.", 50, vul(g => { const n = g.n, m = n * (n + 2); if (n < 2) return 0; const r = (4 * ((facMod(n - 1, m) + 1) % m) + n) % m; return 50 * r / m; }, g => { const n = g.n, m = n * (n + 2); if (n < 2) return "–"; const r = (4 * ((facMod(n - 1, m) + 1) % m) + n) % m; return r === 0 ? "0 ✓ tweeling" : `${r}`; })),
    lens("rowland", "Rowland: a(1) = 7, a(n) = a(n−1) + ggd(n, a(n−1)); rood = de stap ggd(n, a(n−1))", "Feit 1210 (Rowland 2008): elke stap a(n) − a(n−1) is 1 of een priemgetal. De stappen boven 1 zijn in deze tabel 5, 3, 11, 3, 23, 3, 47, 3, 5, 3, 101, 3, 7, 11, 3, 13, 233, 3; daarna komen 467, 3, 5, 3, 941, … Het aantal rode bolletjes is de stap in deze rij (+k boven 50). Rechts a(n) en de stap.", 50, vul(g => g.rowlandD || 0, g => g.n > 1 ? `a = ${g.rowland} · stap ${g.rowlandD}` : "a = 7")),
    lens("kempner", "Kempner S(n) = kleinste m met n | m! als rode bolletjes; ✓ als S(n) = n (priem)", "Feit 1214: voor n > 4 is S(n) = n precies als n priem is (Wilson-achtig). Meestal is S(n) de grootste priemfactor van n: S(12) = 4 (4! = 24), S(10) = 5. Het aantal rode bolletjes is S(n), met +k boven 50. Uitzonderingen op 'grootste priemfactor' beginnen 4, 8, 9, 12, 16, 18, 24, 25, 27, 32. Rechts S(n).", 50, vul(g => kempner(g.n), g => `${kempner(g.n)}${kempner(g.n) === g.n && g.n > 4 ? " ✓" : ""}`)),
  ]);

  groep("Kwadraten en wortels", [
    lens("eulercrit", "Euler: a^((p−1)/2) mod p voor a = 50 … 1: rood = +1 (kwadraat), grijs = −1, wit = p | a", "Feit 1301: a^((p−1)/2) ≡ (a/p) (mod p). De rij bevat (p − 1)/2 kwadraten en evenveel niet-kwadraten. Rood = kwadraatrest, grijs = niet-rest. Bij p ≡ 3 (mod 4) is het patroon antisymmetrisch (a rood ⇔ p − a grijs), bij p ≡ 1 (mod 4) symmetrisch. Rechts het aantal kwadraten onder 50.", 50, plekken(1, (a, g) => { const p = g.n; if (!isPriem(p) || p === 2) return [""]; const l = legendre(a, p); return [l === 1 ? "r" : l === -1 ? "z" : "", `(${a}/${p}) = ${l}`]; }, g => isPriem(g.n) && g.n > 2 ? [...Array(50).keys()].filter(k => legendre(k + 1, g.n) === 1).length : "")),
    lens("nonres", "Kleinste niet-kwadraatrest n₀(p) als rode bolletjes; grijs = de elementaire grens √p + 1", "Feit 1304: n₀(p) is altijd priem en voldoet aan n₀(n₀ − 1) < p, dus n₀ < √p + 1 (grijs bolletje). Bewijs: met q = n₀ en m = ⌈p/q⌉ is mq − p een rest (kleiner dan q), dus mq is een rest, dus m is een niet-rest en m ≥ q, dus p > q(q − 1). Onder GRH geldt zelfs n₀ < 2 ln² p (Bach 1990), en Burgess bewees n₀ ≪ p^0,152. Records (feit 1305): n₀ = 2 (p = 3), 3 (7), 5 (23), 7 (71), 11 (311), 13 (479), 17 (1559). Hier is het hoogst 7, bij 71, 191 en 239. Rechts n₀ en de grens.", 50, g => { const p = g.n; if (!isPriem(p) || p < 3) return { posities: [], titels: [] }; let n0 = 0; for (let a = 2; a < p; a++) if (legendre(a, p) === -1) { n0 = a; break; } const posities = [...Array(n0).keys()], grens = Math.sqrt(p) + 1; return { posities, titels: posities.map(() => `n₀(${p}) = ${n0}`), zacht: [Math.round(grens) - 1], waarde: `n₀ = ${n0} · √p + 1 = ${grens.toFixed(1)}` }; }),
    lens("reciprociteit", "Reciprociteit: voor priem n en q = 229 … 2: rood = (n/q) = (q/n), grijs = tegengesteld (alleen als beide ≡ 3 mod 4)", "Feit 1302 (Gauss 1796): (p/q)(q/p) = (−1)^((p−1)(q−1)/4). De symbolen zijn gelijk, behalve als p én q beide ≡ 3 (mod 4): dan zijn ze tegengesteld. Rood = gelijk, grijs = tegengesteld, wit alleen bij q = n of q = 2. Bij n ≡ 1 (mod 4) is de hele rij rood; bij n ≡ 3 (mod 4) zijn precies de q ≡ 3 (mod 4) grijs. Rechts n mod 4.", 50, overPriemen((q, g) => { const p = g.n; if (!isPriem(p) || p === 2 || q === p || q === 2) return [""]; return [legendre(p, q) === legendre(q, p) ? "r" : "z", `(${p}/${q}) = ${legendre(p, q)}, (${q}/${p}) = ${legendre(q, p)}`]; }, g => isPriem(g.n) && g.n > 2 ? `${g.n % 4} (mod 4)` : "")),
    lens("x2y2", "n = x² + 2y² op hoeveel manieren (rood); priemen lukken precies als p ≡ 1 of 3 (mod 8)", "Feit 1307 (Fermat, Euler): een priem is x² + 2y² precies als p ≡ 1 of 3 (mod 8): 3 = 1 + 2, 11 = 9 + 2, 17 = 9 + 8, 19 = 1 + 18. Dat komt doordat −2 dan een kwadraat mod p is. Het aantal rode bolletjes is het aantal paren (x, y) met x, y ≥ 0. Rechts de eerste schrijfwijze.", 50, vul(g => { let c = 0; for (let y = 0; 2 * y * y <= g.n; y++) if (isKwadraat(g.n - 2 * y * y)) c++; return c; }, g => { for (let y = 0; 2 * y * y <= g.n; y++) if (isKwadraat(g.n - 2 * y * y)) return `${Math.sqrt(g.n - 2 * y * y)}² + 2·${y}²`; return ""; })),
    lens("x3y2", "n = x² + 3y² op hoeveel manieren (rood); priemen lukken precies als p ≡ 1 (mod 3) (en p = 3)", "Feit 1307: een priem p is x² + 3y² precies als p = 3 of p ≡ 1 (mod 3): 7 = 4 + 3, 13 = 1 + 12, 19 = 16 + 3, 31 = 4 + 27. Dit zijn de priemen die in de Eisenstein-gehelen splitsen. Rood = aantal schrijfwijzen met x, y ≥ 0. Rechts de eerste.", 50, vul(g => { let c = 0; for (let y = 0; 3 * y * y <= g.n; y++) if (isKwadraat(g.n - 3 * y * y)) c++; return c; }, g => { for (let y = 0; 3 * y * y <= g.n; y++) if (isKwadraat(g.n - 3 * y * y)) return `${Math.sqrt(g.n - 3 * y * y)}² + 3·${y}²`; return ""; })),
    lens("nonrestrick", "De niet-rest-truc: q = 229 … 2 met (n/q) = −1 (rood) kan x² − n nooit delen; grijs = q | n", "Feit 1308: deelt een oneven priem q een waarde x² − D (met gcd(x, y) = 1), dan is D een kwadraat mod q. Dus als (D/q) = −1, deelt q nooit x² − D. Rood = zo'n q voor D = n: hoe meer rood links, hoe priemrijker x² − n. Dat is de truc achter de recordpolynomen (puzzels 597, 1139, feit 5010). Rechts hoeveel van de eerste 15 priemen afvallen.", 50, overPriemen((q, g) => { if (q === 2) return [g.n % 2 === 1 && g.n % 8 !== 1 ? "r" : "", "2"]; const l = legendre(g.n, q); return [l === -1 ? "r" : l === 0 ? "z" : "", `(${g.n}/${q}) = ${l}`]; }, g => `${P50.slice(0, 15).filter(q => q > 2 ? legendre(g.n, q) === -1 : g.n % 2 === 1 && g.n % 8 !== 1).length} van 15`)),
    lens("primwortels", "Aantal primitieve wortels φ(p − 1) als rode bolletjes; grijs bolletje = de kleinste primitieve wortel g(p)", "Feit 1401: de eenheden mod p vormen een cyclische groep, dus er zijn φ(p − 1) primitieve wortels. Feit 1404: de kleinste primitieve wortel g(p) is meestal klein (2 voor 3, 5, 11, 13, 19, 29, …), met records g = 2, 3, 5, 6, 7, 19, 21, 23 bij p = 3, 7, 23, 41, 71, 191, 409, 2161. Rood = φ(p − 1), grijs = g(p). Rechts beide.", 50, g => { const p = g.n; if (!isPriem(p)) return { posities: [], titels: [] }; const c = n_(p - 1).phi; let w = 1; if (p > 2) for (w = 2; ordMod(w, p) !== p - 1; w++); const posities = [...Array(Math.min(c, 50)).keys()]; return { posities, titels: posities.map(() => `φ(${p - 1}) = ${c}`), zacht: [w - 1], waarde: `${c} · g = ${w}` }; }),
    lens("orde", "Orde van n modulo q = 229 … 2: rood = n is primitieve wortel (orde q − 1), grijs = orde (q − 1)/2", "Feit 1402 (Artin): 2 is primitieve wortel voor ongeveer 37,4 % van de priemen (onder GRH). Rood = n heeft orde q − 1 mod q, grijs = orde precies (q − 1)/2, dan is n een kwadraatrest mod q waarvan −n wél een primitieve wortel kan zijn. Kwadraten (4, 9, 16 …) zijn nooit rood: hun orde deelt (q − 1)/2. Rechts het aantal rode onder de 50, tegen Artins 37 %.", 50, overPriemen((q, g) => { const o = ordMod(g.n, q); return [o === q - 1 ? "r" : o === (q - 1) / 2 ? "z" : "", `orde ${o} mod ${q}`]; }, g => `${P50.filter(q => ordMod(g.n, q) === q - 1).length} van 50`)),
    lens("drieopeen", "Primitieve wortels mod priem n, g = 50 … 1 (rood); rechts de eerste drie opeenvolgende", "Feit 1403 (Cohen–Oliveira e Silva–Trudgian 2015): elke priem q > 169 heeft drie opeenvolgende getallen die alle drie primitieve wortel zijn. Rood = g is primitieve wortel mod n. Rechts het kleinste drietal g, g + 1, g + 2 (onder 169 soms 'geen'); bij 7 zijn 3 en 5 de wortels, dus geen drietal.", 50, plekken(1, (a, g) => { const p = g.n; if (!isPriem(p) || a >= p) return [""]; return [ordMod(a, p) === p - 1 ? "r" : "", `${a} is primitieve wortel mod ${p}`]; }, g => { const p = g.n; if (!isPriem(p) || p < 3) return ""; const w = [...Array(p).keys()].map(a => a > 0 && ordMod(a, p) === p - 1); for (let a = 1; a + 2 < p; a++) if (w[a] && w[a + 1] && w[a + 2]) return `${a}, ${a + 1}, ${a + 2}`; return "geen"; })),
    lens("wortelmin1", "Oplossingen van x² ≡ −1 (mod n), x = 50 … 1 (rood); rechts hoeveel er zijn", "Feit 1303: −1 is een kwadraat mod p precies als p ≡ 1 (mod 4), en dan zijn er precies twee wortels x en p − x. Voor samengestelde n telt elke priemfactor ≡ 1 (mod 4) dubbel: 65 = 5 · 13 heeft vier wortels (8, 18, 47, 57), 25 heeft er twee (7, 18); een factor ≡ 3 (mod 4) of 4 | n maakt het onmogelijk. Rechts het aantal oplossingen onder n.", 50, plekken(1, (x, g) => [x < g.n && (x * x + 1) % g.n === 0 ? "r" : "", `${x}² + 1 ≡ 0 (mod ${g.n})`], g => [...Array(g.n).keys()].filter(x => (x * x + 1) % g.n === 0).length)),
  ]);

  groep("Bijzondere vormen", [
    lens("mersennefact", "Priemen q ≤ 229 die 2ⁿ − 1 delen (rood); grijs = q ≡ 1 (mod 2n) én ±1 (mod 8), de klasse waar factoren moeten zitten", "Feit 1503: elke priemfactor q van 2ᵖ − 1 (p oneven priem) voldoet aan q ≡ 1 (mod 2p) en q ≡ ±1 (mod 8). Rood = q deelt 2ⁿ − 1; bij priem n liggen die altijd in de grijze klasse. 2¹¹ − 1 = 2047 = 23 · 89: 23 = 2·11 + 1 en 89 = 8·11 + 1. Feit 1501: is 2ⁿ − 1 priem, dan is n priem. Rechts de kleinste priemfactor onder 229, of '–'.", 50, overPriemen((q, g) => { const n = g.n, d = powmod(2, n, q) === 1; return [d ? "r" : isPriem(n) && n > 2 && (q - 1) % (2 * n) === 0 && (q % 8 === 1 || q % 8 === 7) ? "z" : "", `${q} deelt 2^${n} − 1`]; }, g => { const q = P50.find(q => powmod(2, g.n, q) === 1); return q ? `kleinste ${q}` : "–"; })),
    lens("fermatfact", "Priemen q ≤ 229 die 2ⁿ + 1 delen (rood); open rondje = 3, dat 2ⁿ + 1 deelt voor elke oneven n", "Feit 1107: 2ᵖ + 1 ≡ 0 (mod 3) voor oneven p; daarom heten (2ᵖ + 1)/3 de Wagstaff-getallen. Feit 1502: 2ⁿ + 1 kan alleen priem zijn als n een macht van 2 is (Fermat-getallen F_k = 2^(2^k) + 1), en feit 1504: elke priemfactor van F_k is ≡ 1 (mod 2^(k+2)); 641 | F₅ (Euler 1732). Rood = q deelt 2ⁿ + 1. Rechts 2ⁿ + 1 mod 3 en de kleinste factor.", 50, overPriemen((q, g) => [powmod(2, g.n, q) === q - 1 ? "r" : q === 3 ? "o" : "", `${q} deelt 2^${g.n} + 1`], g => { const q = P50.find(q => powmod(2, g.n, q) === q - 1); return `${q ? "kleinste " + q : "geen ≤ 229"}`; })),
    lens("euler2p1", "Euler–Lagrange: (2ᵖ − 1) mod (2p + 1) geschaald naar 50 bolletjes; leeg = 2p + 1 deelt 2ᵖ − 1", "Feit 1505 (Euler 1750) en 6202: is p ≡ 3 (mod 4) en 2p + 1 priem, dan deelt 2p + 1 het Mersenne-getal 2ᵖ − 1 (23 | 2¹¹ − 1, 47 | 2²³ − 1, 167 | 2⁸³ − 1), dus zo'n Mersenne-getal is samengesteld. Omgekeerd: voor p ≡ 3 (mod 4) is 2p + 1 priem precies als het 2ᵖ − 1 deelt. De rij is leeg (✓) als 2p + 1 deelt; rechts de rest.", 50, vul(g => { const p = g.n; if (!isPriem(p) || p < 3) return 0; const m = 2 * p + 1, r = (powmod(2, p, m) - 1 + m) % m; return 50 * r / m; }, g => { const p = g.n; if (!isPriem(p) || p < 3) return ""; const m = 2 * p + 1, r = (powmod(2, p, m) - 1 + m) % m; return r === 0 ? `${m} deelt 2^${p} − 1 ✓` : `rest ${r} (${isPriem(m) ? m + " priem" : m + " samengesteld"})`; })),
    lens("repunitfact", "Priemen q ≤ 229 die de repunit R_n = 11…1 (n enen) delen (rood)", "Feit 1506: R_n kan alleen priem zijn als n priem is (R_ab is deelbaar door R_a), en de bewezen repunitpriemen zijn R₂, R₁₉, R₂₃, R₃₁₇, R₁₀₃₁, … Rood = q deelt R_n; 3 deelt R_n precies als 3 | n, 11 als n even is, 37 als 3 | n, 101 als 4 | n (feit 9107: 10ᵏ mod q hangt alleen af van k mod de orde van 10). Rechts de kleinste factor onder 229.", 50, overPriemen((q, g) => [q !== 2 && q !== 5 && repunitMod(g.n, q) === 0 ? "r" : "", `${q} deelt R_${g.n}`], g => { const q = P50.find(q => q !== 2 && q !== 5 && repunitMod(g.n, q) === 0); return q ? `kleinste ${q}` : g.n === 1 ? "R₁ = 1" : "geen ≤ 229"; })),
    lens("lucaslehmer", "Lucas–Lehmer voor M_n = 2ⁿ − 1 (n priem): rood = s_k ≡ 0 (mod M_n), k = 49 … 0", "Feit 6101: s₀ = 4, s_(k+1) = s_k² − 2; M_p is priem precies als s_(p−2) ≡ 0 (mod M_p). Rood = s_k ≡ 0 (mod M_n) voor k = 0 … 49; bij een Mersenne-priem staat dat bolletje op k = p − 2 (2 → –, 3 → k = 1, 5 → 3, 7 → 5, 13 → 11, 17 → 15, 19 → 17, 31 → 29, en 61, 89, 107, 127 vallen buiten de 50). Feit 1507: de Mersenne-exponenten tot 256 zijn 2, 3, 5, 7, 13, 17, 19, 31, 61, 89, 107, 127. Rechts ✓ of de kleinste factor.", 50, plekken(0, (k, g) => { const p = g.n; if (!isPriem(p) || p < 3) return [""]; const M = (1n << BigInt(p)) - 1n; let s = 4n; for (let i = 0; i < k; i++) s = (s * s - 2n) % M; return [s === 0n ? "r" : "", `s_${k} ≡ 0 (mod M_${p})`]; }, g => { const p = g.n; if (!isPriem(p)) return ""; if (p === 2) return "M₂ = 3 ✓"; const M = (1n << BigInt(p)) - 1n; let s = 4n; for (let i = 0; i < p - 2; i++) s = (s * s - 2n) % M; if (s === 0n) return `M_${p} priem ✓`; const q = P50.find(q => powmod(2, p, q) === 1); return q ? `÷${q}` : "samengesteld"; })),
    lens("veelhoek", "Gauss–Wantzel: de oneven priemfactoren van n (rood = Fermat-priem, grijs = andere); ✓ = regelmatige n-hoek construeerbaar", "Feit 1508: een regelmatige n-hoek is met passer en liniaal te construeren precies als n = 2ᵏ · (verschillende Fermat-priemen). Tot 256 zijn de Fermat-priemen 3, 5, 17 (en 257 net erbuiten). Bolletje k (van rechts, k = 1 … 50) is rood als k een Fermat-priem is die n precies één keer deelt, grijs als k een andere oneven priemfactor is of een Fermat-priem die dubbel deelt. Construeerbaar: 3, 4, 5, 6, 8, 10, 12, 15, 16, 17, 20, 24, 30, 32, 34, 40, 48, 51, 60, 64, 68, 80, 85, 96, 102, 120, 128, 136, 160, 170, 192, 204, 240, 255, 256. Rechts ✓ of ✗.", 50, g => { const F = [3, 5, 17], posities = [], titels = [], zacht = []; let ok = true; for (const p of g.uniek) { if (p === 2) continue; const e = g.f.filter(q => q === p).length; if (F.includes(p) && e === 1) { posities.push(p - 1); titels.push(`${p}: Fermat-priem`); } else { if (p <= 50) zacht.push(p - 1); ok = false; } } return { posities, titels, zacht, waarde: ok && g.n >= 3 ? "✓" : g.n >= 3 ? "✗" : "" }; }),
    lens("zsigmondy32", "Priemen q ≤ 229 die 3ⁿ − 2ⁿ delen: rood = primitief (deelt geen eerdere 3ᵏ − 2ᵏ), grijs = niet primitief", "Feit 1509 (Zsigmondy 1892): aⁿ − bⁿ heeft voor n ≥ 2 een primitieve priemdeler, op 2⁶ − 1 en (n = 2, a + b macht van 2) na; voor 3ⁿ − 2ⁿ zijn er geen uitzonderingen. Zo'n q heeft 3/2 van orde n mod q, dus q ≡ 1 (mod n). Rood = primitieve deler, grijs = deler die al een eerdere term deelde. 3² − 2² = 5, 3³ − 2³ = 19, 3⁴ − 2⁴ = 65 = 5 · 13, 3⁵ − 2⁵ = 211. Rechts de kleinste primitieve deler onder 229, of '> 229'.", 50, overPriemen((q, g) => { if (q === 2 || q === 3) return [""]; const r = 3 * powmod(2, q - 2, q) % q, o = ordMod(r, q); return [o === g.n ? "r" : g.n % o === 0 ? "z" : "", `orde van 3/2 mod ${q} is ${o}`]; }, g => { if (g.n < 2) return "–"; const q = P50.find(q => q > 3 && ordMod(3 * powmod(2, q - 2, q) % q, q) === g.n); return q ? `${q}` : "> 229"; })),
    lens("sylvester", "Sylvester: n deelt s_k (k = 9 … 0) met s₀ = 2, s_(k+1) = s_k² − s_k + 1 (rood)", "Feit 1513: de rij 2, 3, 7, 43, 1807, 3263443, … (s_(k+1) = s₀s₁⋯s_k + 1) heeft paarsgewijs copriemtermen: elke priem deelt hoogstens één term. Dat bewijst opnieuw dat er oneindig veel priemen zijn. Rood = n deelt s_k; een priemrij heeft dus hoogstens één rood bolletje (13 deelt 1807 = 13 · 139, 139 ook). Rechts de kleinste k met n | s_k, of 'geen'.", 10, g => { const posities = [], titels = []; SYLVESTER.forEach((s, k) => { if (s % BigInt(g.n) === 0n) { posities.push(k); titels.push(`s_${k} = ${s.toString().length > 20 ? s.toString().slice(0, 12) + "…" : s}`); } }); return { posities, titels, waarde: posities.length ? `s_${posities[0]}` : "geen" }; }),
    lens("polignac", "n − 2ᵏ priem? (k = 49 … 0, rood); grijs = 2ᵏ ≥ n; een lege rij is een de Polignac-getal", "Feit 1515: de getallen p + 2ᵏ hebben positieve dichtheid (Romanov 1934), maar niet elk oneven getal is zo te schrijven: de oneven uitzonderingen beginnen 1, 127, 149, 251, 331, 337, 373, 509 (de Polignac-getallen). Rood = n − 2ᵏ is priem. In deze tabel hebben de oneven 127, 149 en 251 geen enkel rood bolletje (en 1). Rechts het aantal manieren.", 50, plekken(0, (k, g) => { const v = g.n - 2 ** k; return [v >= 2 && isPriem(v) ? "r" : v < 2 ? "z" : "", `${g.n} − 2^${k} = ${v}`]; }, g => [...Array(9).keys()].filter(k => g.n - 2 ** k >= 2 && isPriem(g.n - 2 ** k)).length)),
    lens("machten", "Perfecte machten: rood bij exponent k (k = 50 … 2) als n = xᵏ; ✓ bij 8 en 9, de enige opeenvolgende", "Feit 1511 (Mihăilescu 2002, Catalans vermoeden): xᵃ − yᵇ = 1 heeft alleen de oplossing 3² − 2³ = 1, dus 8 en 9 zijn de enige twee opeenvolgende perfecte machten. Rood = n is een k-de macht (64 = 2⁶ = 4³ = 8²: rood bij 2, 3 en 6). Feit 1512: een product van twee of meer opeenvolgende getallen is nooit een perfecte macht. Rechts de schrijfwijze met de grootste exponent.", 50, plekken(2, (k, g) => { const x = Math.round(g.n ** (1 / k)); return [x >= 2 && x ** k === g.n ? "r" : "", `${g.n} = ${x}^${k}`]; }, g => { for (let k = 8; k >= 2; k--) { const x = Math.round(g.n ** (1 / k)); if (x >= 2 && x ** k === g.n) return `${x}^${k}${g.n === 8 || g.n === 9 ? " ✓" : ""}`; } return ""; })),
  ]);

  groep("Verdeling", [
    lens("race3", "Priemrace mod 3: team 2 tegen team 1 (3 bolletjes per priem, rechts = team 2 voorop)", "Feit 1603: mod 3 is Chebyshevs vooroordeel nog sterker dan mod 4: π(x; 3, 2) − π(x; 3, 1) ≥ 2 voor elke x tussen 10⁵ en 1,4·10¹¹, en de eerste x waar team 1 voorstaat is 608 981 813 029 (Bays–Hudson 1978). Team 1 bevat alle kwadraten van priemen (feit 1605). Rechts de stand.", 50, g => staaf(3 * g.race3, `team 2 − team 1 = ${g.race3}`, { waarde: (g.race3 > 0 ? "+" : "") + g.race3 })),
    lens("eersteprime1", "Kleinste priem ≡ 1 (mod n): rood = k met k·n + 1 die priem (k = 50 … 1), open rondje = de kleinste", "Feit 1612: de kleinste priem ≡ 1 (mod n) is 2, 3, 7, 5, 11, 7, 29, 17, 19, 11, 23, 13, 53, 29, 31, 17, 103, 19, 191, 41 voor n = 1 … 20. Feit 1510 geeft de grens 2ⁿ − 1 (via Zsigmondy), Linnik (feit 1607) n^L met L ≤ 5. Rood = k·n + 1 is priem; het open rondje staat op de eerste. Rechts die priem en k.", 50, plekken(1, (k, g) => { const v = k * g.n + 1, p = isPriem(v); let eerste = 0; for (let j = 1; !eerste; j++) if (isPriem(j * g.n + 1)) eerste = j; return [p && k === eerste ? "o" : p ? "r" : "", `${k}·${g.n} + 1 = ${v}`]; }, g => { for (let j = 1; ; j++) if (isPriem(j * g.n + 1)) return `${j * g.n + 1} (k = ${j})`; })),
    lens("linnik", "Kleinste priem in elke klasse a (mod n), a = 50 … 1: rood = die priem < 2n, grijs = < n², wit = a niet copriem", "Feit 1610: voor 3 ≤ q ≤ 2000 heeft elke klasse a mod q een priem onder q², en P(q)/(q ln² q) ≤ 2,154. Feit 1607 (Linnik): P(a, q) ≪ q^L, bewezen met L = 5 (Xylouris). Rood = de kleinste priem ≡ a (mod n) ligt al onder 2n, grijs = onder n² (altijd, hier). Rechts de grootste 'kleinste priem' over alle klassen en in welke klasse.", 50, plekken(1, (a, g) => { if (a >= g.n && g.n > 1 || ggd(a, g.n) !== 1) return [""]; const p = kleinstePriemIn(a, g.n); return [p && p < 2 * g.n ? "r" : p ? "z" : "", `klasse ${a}: ${p}`]; }, g => { let best = 0, ba = 0; for (let a = 1; a < Math.max(g.n, 2); a++) if (ggd(a, g.n) === 1) { const p = kleinstePriemIn(a, g.n); if (p > best) { best = p; ba = a; } } return g.n > 2 ? `max ${best} in klasse ${ba}` : ""; })),
    lens("mertens1", "Mertens: 100·(Σ_(p≤n) 1/p − ln ln n − M) als staafje, M = 0,2615 (rechts = te hoog)", "Feit 2002 (Mertens 1874): Σ_(p≤x) 1/p = ln ln x + M + O(1/ln x) met M = 0,2614972…. Het staafje toont de rest, maal 100: hij schommelt en kruipt naar 0, met een sprongetje omhoog bij elke priem. Rechts de som en de rest.", 50, g => { const r = g.n > 1 ? g.som1p - Math.log(Math.log(g.n)) - 0.2614972128 : 0; return staaf(100 * r, `rest ${r.toFixed(4)}`, { waarde: g.n > 1 ? `${g.som1p.toFixed(4)} · ${(100 * r).toFixed(1)}` : "–" }); }),
    lens("mertens3", "Mertens: 100·(e^γ · ln n · ∏_(p≤n)(1 − 1/p) − 1) als staafje", "Feit 2002: ∏_(p≤x)(1 − 1/p) ~ e^(−γ)/ln x. Het product maal e^γ ln n gaat dus naar 1; het staafje is de afwijking maal 100. Die afwijking is wat de zeef 'te veel' overlaat: de Mertens-paradox (FINDINGS) zegt dat de zeef tot √x precies 2e^(−γ) = 1,12 keer zoveel overlevers laat als er priemen zijn. Rechts het product en de afwijking.", 50, g => { const v = g.n > 1 ? EG * Math.log(g.n) * g.prod - 1 : 0; return staaf(100 * v, `afwijking ${v.toFixed(4)}`, { waarde: g.n > 1 ? `${g.prod.toFixed(4)} · ${(100 * v).toFixed(1)}` : "–" }); }),
    lens("theta", "θ(n) − n = Σ_(p≤n) ln p − n als staafje (links = θ < n); grijs = ±√n", "Feit 2034: θ(x) < x voor elke x tot 1,39·10¹⁷, maar ergens onder exp(727,95) wordt θ(x) > x (Platt–Trudgian 2016); het eerste zo'n x is onbekend, net als bij Littlewoods li(x) − π(x). Het staafje is θ(n) − n, en blijft hier links. Rechts θ(n) − n en de verhouding θ(n)/n.", 50, g => staaf(g.theta - g.n, `θ(${g.n}) − ${g.n} = ${(g.theta - g.n).toFixed(2)}`, { zacht: [MID - Math.round(Math.sqrt(g.n)), MID + Math.round(Math.sqrt(g.n))], waarde: `${(g.theta - g.n).toFixed(1)} · ${(g.theta / g.n).toFixed(3)}` })),
    lens("legendretel", "Legendres telformule: termen μ(d)⌊n/d⌋ over de delers d van ∏_(p≤√n) p: rood = +, grijs = −", "Feit 2020 (Legendre): π(n) − π(√n) + 1 = Σ_d μ(d)·⌊n/d⌋ over de kwadraatvrije d uit de priemen ≤ √n. Elke term is een bolletje: rood als μ(d) = +1 (d heeft een even aantal priemfactoren), grijs als −1; hover geeft d en de term. Bij n = 256 zijn er 2⁶ = 64 termen. Zo telt in- en uitsluiting de priemen zonder ze te kennen; moderne methoden (feit 2020) halen π(x) in x^(2/3) stappen. Rechts de som.", 50, g => { const ps = PRIEMEN.filter(p => p * p <= g.n), ds = [[1, 1]]; for (const p of ps) ds.push(...ds.map(([d, m]) => [d * p, -m])); ds.sort((a, b) => a[0] - b[0]); const posities = [], titels = [], zacht = []; let som = 0; ds.forEach(([d, m], i) => { const t = m * Math.floor(g.n / d); som += t; if (m > 0) { posities.push(i); titels.push(`+⌊${g.n}/${d}⌋ = ${t}`); } else zacht.push(i); }); return { posities, titels, zacht, waarde: `${som} = π(${g.n}) − π(√${g.n}) + 1` }; }),
    lens("erdoskac", "ω(n) als rode bolletjes; grijs = ln ln n (afgerond); open = ln ln n ± √(ln ln n)", "Feit 2024 (Hardy–Ramanujan, Erdős–Kac): een typisch getal heeft ongeveer ln ln n verschillende priemfactoren, en de afwijking daarvan gedraagt zich als een normale verdeling met spreiding √(ln ln n). Rood = ω(n), grijs = ln ln n, open = één standaardafwijking eromheen. Het gemiddelde van ω tot x is ln ln x + 0,2615 (Mertens' constante!). Rechts ω(n) en ln ln n.", 50, g => { const m = g.n > 2 ? Math.log(Math.log(g.n)) : 0, s = Math.sqrt(Math.max(m, 0)), w = g.uniek.length, posities = [...Array(w).keys()]; return { posities, titels: posities.map(() => `ω = ${w}`), zacht: g.n > 2 ? [Math.round(m) - 1] : [], as: g.n > 2 ? [Math.max(0, Math.round(m - s) - 1), Math.round(m + s) - 1] : [], waarde: `${w} · ${m.toFixed(2)}` }; }),
    lens("nicolas", "Nicolas: n/φ(n) (rood, ×10) tegen e^γ ln ln n (grijs, ×10); de Riemann-hypothese zegt: grijs wint vanaf de primorialen", "Feit 2009 geeft Robins criterium met σ; Nicolas (1983) gaf het φ-spiegelbeeld: RH is waar precies als n/φ(n) < e^γ ln ln n voor alle primorialen n = p#. Rood = 10·n/φ(n), grijs = 10·e^γ·ln ln n. Primorialen (2, 6, 30, 210) hebben de grootste n/φ(n): 2, 3, 3,75, 4,375. Rechts n/φ(n).", 50, g => { const r = g.n / g.phi, b = g.n > 2 ? EG * Math.log(Math.log(g.n)) : 0, posities = [...Array(Math.round(10 * r)).keys()]; return { posities, titels: posities.map(() => `${g.n}/φ = ${r.toFixed(3)}`), zacht: b > 0 ? [Math.round(10 * b) - 1] : [], waarde: r.toFixed(3) }; }),
    lens("bruntitch", "Priemen in (n, n + 50] (rood, vooruit); open rondje = de Brun–Titchmarsh-grens 2·50/ln 50 ≈ 25,6", "Feit 2014 (Montgomery–Vaughan): π(x + y) − π(x) ≤ 2y/ln y voor elke x: nooit meer dan 25 priemen in 50 opeenvolgende getallen, waar je ook begint. Het echte maximum voor y = 50 is kleiner (het breedste toelaatbare patroon, feit 4002: 15 priemen in 50 getallen lukt alleen heel vroeg, 17 … 73 heeft 15 priemen in breedte 56). Rood = n + k is priem, k = 1 … 50. Rechts het aantal.", 50, plekken(1, (k, g) => P(g.n + k), g => [...Array(50).keys()].filter(k => isPriem(g.n + k + 1)).length)),
  ]);

  groep("Gaten", [
    lens("nagura", "Afstand tot de volgende priem (rood); grijs = Nagura's grens n/5, open = Bertrands grens n", "Feit 3003: er ligt altijd een priem in (n, 2n] (Bertrand, Chebyshev 1852), in (n, 6n/5] voor n ≥ 25 (Nagura 1952) en in (x, x(1 + 1/(2 ln² x))] (Dusart, feit 2033). Rood = afstand tot de volgende priem; grijs = n/5, open = n (buiten de 50 bij grote n). De rode bolletjes blijven ver onder het grijze; het gat is gemiddeld maar ln n.", 50, g => { const d = volgende(g.n) - g.n, posities = [...Array(Math.min(d, 50)).keys()]; return { posities, titels: posities.map(() => `volgende priem ${volgende(g.n)}`), zacht: g.n >= 25 ? [Math.round(g.n / 5) - 1] : [], as: g.n <= 50 ? [g.n - 1] : [], waarde: `${d} · n/5 = ${(g.n / 5).toFixed(1)}` }; }),
    lens("andrica", "Andrica: 50·(√p_(n+1) − √p_n) als rode bolletjes; de grens is 50 (de hele rij)", "Feit 3006 (Andrica): √p_(n+1) − √p_n < 1 voor alle n, onbewezen; gelijkwaardig met g_n < 2√p_n + 1. Het grootste verschil is 0,6709 bij (7, 11), hier 34 bolletjes; daarna wordt het snel kleiner, want √(p + g) − √p ≈ g/(2√p): na 113 (gat 14) nog 0,639. Rood = 50 maal het verschil voor priem n. Rechts het verschil.", 50, vul(g => isPriem(g.n) ? 50 * (Math.sqrt(volgende(g.n)) - Math.sqrt(g.n)) : 0, g => isPriem(g.n) ? (Math.sqrt(volgende(g.n)) - Math.sqrt(g.n)).toFixed(4) : "")),
    lens("merit", "Merit van het gat na priem n: g/ln n, maal 10 (rood); records: 2, 3, 7, 113, 1129, 1327, …", "Feit 3012 en 3025: de merit g/ln p meet een gat tegen het gemiddelde gat ln p. Records tot 2·10⁸ staan bij p = 2, 3, 7, 113, 1129, 1327, 19609, 31397, 155921, …; de hoogste tot 1,4·10¹¹ is 19,04 (gat 456 na 25056082087), en het wereldrecord is 42,5. Rood = 10 maal de merit. Rechts de merit; in deze tabel is 113 (gat 14, merit 2,96) de laatste recordhouder.", 50, vul(g => isPriem(g.n) ? 10 * (volgende(g.n) - g.n) / Math.log(g.n) : 0, g => isPriem(g.n) ? ((volgende(g.n) - g.n) / Math.log(g.n)).toFixed(2) : "")),
    lens("erdosturan", "Venster: rood = priem waarna het gat groter is dan het gat ervoor, grijs = kleiner, open = gelijk", "Feit 3010 (Erdős–Turán 1948): de gaten stijgen oneindig vaak en dalen oneindig vaak; g_(n+1) = g_n komt ook oneindig vaak voor (feit 4007, CPAP-3). Feit 3021: de verhouding g_(n+1)/g_n wordt willekeurig groot en klein (Pintz 2014). Rood = het gat na deze priem is groter dan het gat ervoor, grijs = kleiner, open = gelijk. Rechts de twee gaten rond n.", 50, venster(x => { if (!isPriem(x) || x < 3) return [""]; const a = x - vorige(x), b = volgende(x) - x; return [b > a ? "r" : b < a ? "z" : "o", `${a} → ${b}`]; }, g => isPriem(g.n) && g.n > 2 ? `${g.n - vorige(g.n)} → ${volgende(g.n) - g.n}` : "")),
    lens("eerstegat", "Gat na priem n (rood); rechts waar dit gat voor het eerst voorkwam (feit 3019)", "Feit 3019: elk even gat komt ooit voor het eerst voor: 2 na 3, 4 na 7, 6 na 23, 8 na 89, 10 na 139, 12 na 199, 14 na 113, 16 na 1831, 18 na 523, 20 na 887, 22 na 1129. Opvallend: 14 komt vóór 10 en 12. Rood = het gat na n; rechts de priem waar dit gat zijn debuut had, en ✓ als dat n zelf is.", 50, vul(g => isPriem(g.n) ? volgende(g.n) - g.n : 0, g => { if (!isPriem(g.n)) return ""; const d = volgende(g.n) - g.n; return `${d}: eerst na ${eersteGat[d]}${eersteGat[d] === g.n ? " ✓" : ""}`; })),
    lens("capelle", "Capelle: voor opeenvolgende priemen r < q < p rond n: (p − r)(q − r) als rode bolletjes, open rondje = r; identiteit geldt als rood < open", "Feit 3017: ⌊pq/r⌋ = p + q − r precies als (p − r)(q − r) < r. Dat faalt alleen voor r = 2, 3, 5, 7, 11, 13, 19, 23, 31, 47, 83, 89, 113, 199, 1327 (tot 2·10⁸): de priemen met twee grote gaten erna. Hier is r = n (priem), q en p de twee volgende priemen. Rood = (p − r)(q − r), open rondje = r (buiten beeld boven 50). Rechts of de identiteit geldt.", 50, g => { const r = g.n; if (!isPriem(r)) return { posities: [], titels: [] }; const q = volgende(r), p = volgende(q), v = (p - r) * (q - r), posities = [...Array(Math.min(v, 50)).keys()]; return { posities, titels: posities.map(() => `(${p} − ${r})(${q} − ${r}) = ${v}`), as: r <= 50 ? [r - 1] : [], waarde: v < r ? `${v} < ${r} ✓` : `${v} ≥ ${r} ✗` }; }),
    lens("gatproduct", "Product van twee opeenvolgende gaten g_n·g_(n+1) tegen p_(n+1): rood = 50·product/p_(n+1)", "Feit 9824 (ons): g_n·g_(n+1) < p_(n+1) voor elke n tot 4·10¹⁸, behalve bij (5, 7, 11) en (19, 23, 29): 2·4 = 8 > 7 en 4·6 = 24 ≥ 23. Rood = 50 maal het product gedeeld door de middelste priem; een volle rij zou een schending zijn. Rechts het product en de priem.", 50, vul(g => { const p = g.n; if (!isPriem(p)) return 0; const q = volgende(p), r = volgende(q); return 50 * (q - p) * (r - q) / q; }, g => { const p = g.n; if (!isPriem(p)) return ""; const q = volgende(p), r = volgende(q), v = (q - p) * (r - q); return `${v} ${v < q ? "<" : "≥"} ${q}`; })),
    lens("gatmod6", "Venster: gat na elke priem: rood = gat ≡ 0 (mod 6), grijs = 2 (mod 6), open = 4 (mod 6)", "Feit 3013 en 1108: het gat 6 is het vaakste, en gaten die een veelvoud van 6 zijn komen vaker voor dan hun buren (Hardy–Littlewood geeft ze een factor 2). Rood = het gat na deze priem is een zesvoud, grijs = 2 mod 6 (alleen na p ≡ 5 mod 6), open = 4 mod 6 (alleen na p ≡ 1 mod 6). Rechts de aantallen in het venster.", 50, venster(x => { if (!isPriem(x) || x < 5) return [""]; const d = (volgende(x) - x) % 6; return [d === 0 ? "r" : d === 2 ? "z" : "o", `gat ${volgende(x) - x}`]; }, g => { const t = [0, 0, 0]; for (let k = 0; k < 50; k++) { const x = g.n - k; if (x >= 5 && isPriem(x)) t[((volgende(x) - x) % 6) / 2]++; } return `${t[0]} · ${t[1]} · ${t[2]}`; })),
    lens("faculteitgat", "n! + i voor i = 51 … 2: rood = priem, grijs = i ≤ n (altijd deelbaar door i); alleen tot n = 80", "Feit 3002: n! + 2, …, n! + n zijn allemaal samengesteld (i deelt n! + i), dus er zijn willekeurig lange gaten. Grijs = die gegarandeerde samengestelde; rood = n! + i is toch priem voor i > n (PRP boven 3·10²⁴, en alleen berekend tot n = 80, 119 cijfers). Feit 6204: n! + 1 is priem voor n = 1, 2, 3, 11, 27, 37, 41, 73, 77. Rechts de eerste priem na n! (afstand), of – boven 80.", 50, plekken(2, (i, g) => { if (g.n > 80) return [""]; if (i <= g.n) return ["z"]; return [bigPriem(FAC[g.n] + BigInt(i)) ? "r" : "", `${g.n}! + ${i}`]; }, g => { if (g.n > 80) return "–"; for (let i = 1; i <= 400; i++) if (bigPriem(FAC[g.n] + BigInt(i))) return `n! + ${i} priem`; return "> 400"; })),
    lens("oppermann", "Oppermann: priemen in (n² − n, n²) (rood, links) │ in (n², n² + n) (rood, rechts)", "Feit 3020: Oppermanns vermoeden (1882) zegt dat beide helften tussen (n−1)·n en n·(n+1) een priem bevatten; Legendre vraagt alleen om (n², (n+1)²). Beide zijn open; onder RH is het gat hoogstens √p ln p (feit 3005). Twee blokken van 24: links de priemen in (n² − n, n²), rechts die in (n², n² + n). Rechts de twee aantallen.", 50, g => { const n = g.n, a = [], b = []; for (let x = n * n - n + 1; x < n * n; x++) if (isPriem(x)) a.push(x); for (let x = n * n + 1; x < n * n + n; x++) if (isPriem(x)) b.push(x); const posities = b.slice(0, 24).map((_, i) => i).concat(a.slice(0, 24).map((_, i) => 25 + i)); return { posities, titels: b.slice(0, 24).map(x => `${x}`).concat(a.slice(0, 24).map(x => `${x}`)), as: [24], waarde: `${a.length} · ${b.length}` }; }),
  ]);

  groep("Patronen", [
    lens("vooruit", "Vooruitvenster n … n + 49: rood = priem; rechts het patroon vanaf n (tweeling, drieling, vierling …)", "Feit 4001 en 4019: toelaatbare patronen beginnen bij n als n + h priem is voor elke h in het patroon: (0, 2) tweeling, (0, 2, 6) of (0, 4, 6) drieling, (0, 2, 6, 8) vierling, (0, 2, 6, 8, 12) vijfling, (0, 4, 6, 10, 12, 16) zesling. Rood = n + k is priem. Rechts het grootste patroon dat bij n begint; 5 begint een vijfling (5, 7, 11, 13, 17) en 7 een zesling (7, 11, 13, 17, 19, 23).", 50, vooruit(x => P(x), g => patroon(g.n))),
    lens("breedte", "Priemen in [n, n + 49] (rood, vooruit); open rondje = s(k), de minimale breedte van zoveel priemen (feit 4002)", "Feit 4002: k priemen passen op zijn vroegst in een breedte s(k): s(2) = 2, s(3) = 6, s(4) = 8, s(5) = 12, s(6) = 16, s(7) = 20, s(8) = 26, s(9) = 30, s(10) = 32, s(11) = 36, s(12) = 42, s(13) = 48, s(14) = 50. Rood = priem in het venster; het open rondje staat op s(k) voor het aantal k dat het venster bevat: hoe dichter het laatste rode bolletje bij het rondje, hoe dichter de cluster bij het minimum. Rechts k en s(k).", 50, g => { const S = [0, 0, 2, 6, 8, 12, 16, 20, 26, 30, 32, 36, 42, 48, 50, 56, 60, 66, 70, 76, 80], ps = []; for (let k = 0; k < 50; k++) if (isPriem(g.n + k)) ps.push(k); const span = ps.length ? ps.at(-1) - ps[0] : 0; return { posities: ps, titels: ps.map(k => `${g.n + k}`), as: ps.length >= 2 && S[ps.length] < 50 ? [ps[0] + S[ps.length]] : [], waarde: `${ps.length} priemen, breedte ${span}, minimaal ${S[ps.length] ?? "?"}` }; }),
    lens("brun", "Bruns som Σ (1/p + 1/(p+2)) over tweelingen tot n, geschaald: 50 bolletjes = B₂ = 1,9022", "Feit 4005 (Brun 1919): de som van 1/p over tweelingpriemen convergeert, naar B₂ ≈ 1,902160583 (Nicely, feit 4022). Rood = de som tot n, met 50 bolletjes als B₂. Tot 256 staat ze op 1,446; de rest komt van de oneindige staart, zó langzaam dat B₂ alleen via de Hardy–Littlewood-staart geschat kan worden. Rechts de som.", 50, vul(g => 50 * g.brun / 1.902160583, g => g.brun.toFixed(4))),
    lens("ap3", "Rekenkundige drietallen vanaf n: n, n + d, n + 2d alle priem voor d = 100 … 2 (even d), rood", "Feit 4007 en 4008 (Green–Tao 2008): de priemen bevatten willekeurig lange rekenkundige rijen; de langste bekende heeft 27 termen. Voor een drietal boven 3 moet d even zijn, en boven 5 … moet d deelbaar zijn door 6 (anders is een van de drie deelbaar door 3). Rood = n, n + d, n + 2d alle priem; bij n = 3 kan d = 2 (3, 5, 7). Rechts het aantal.", 50, plekken(1, (k, g) => { const d = 2 * k; return [isPriem(g.n) && isPriem(g.n + d) && isPriem(g.n + 2 * d) ? "r" : "", `${g.n}, ${g.n + d}, ${g.n + 2 * d}`]; }, g => isPriem(g.n) ? [...Array(50).keys()].filter(k => isPriem(g.n + 2 * k + 2) && isPriem(g.n + 4 * k + 4)).length : "")),
    lens("ap4", "Rekenkundige viertallen vanaf n met verschil d = 50 … 1 (rood); boven 5 moet 6 | d", "Feit 4023: de k-termige priemrij met de kleinste laatste term eindigt op 2, 3, 7, 23, 29, 157, 907, 1669, 1879, 2089 voor k = 1 … 10; de rij 5, 11, 17, 23, 29 (d = 6) is de vroegste vijfling. Rood = n, n + d, n + 2d, n + 3d alle priem. Boven 5 moet d een zesvoud zijn, dus staan de rode bolletjes op d = 6, 12, 18, … Rechts het aantal.", 50, plekken(1, (d, g) => [isPriem(g.n) && [1, 2, 3].every(j => isPriem(g.n + j * d)) ? "r" : "", `${g.n}, ${g.n + d}, ${g.n + 2 * d}, ${g.n + 3 * d}`], g => isPriem(g.n) ? [...Array(50).keys()].filter(k => [1, 2, 3].every(j => isPriem(g.n + j * (k + 1)))).length : "")),
    lens("evenwichtig", "Priem n tegenover het gemiddelde van zijn buren: staafje = p − (p_vorig + p_volgend)/2 (rechts = sterk)", "Feit 4014: een evenwichtige priem is het gemiddelde van zijn buren (5, 53, 157, 173, 211, 257), sterk ligt erboven (11, 17, 29, 37, 41, 59, …), zwak eronder (3, 7, 13, 19, 23, 31, …). Het staafje is het verschil; bij 0 is het open rondje het enige. Rechts het verschil en het etiket.", 50, g => { const p = g.n; if (!isPriem(p) || p < 3) return { posities: [], titels: [] }; const v = p - (vorige(p) + volgende(p)) / 2; return staaf(v, `${p} − (${vorige(p)} + ${volgende(p)})/2 = ${v}`, { waarde: `${v > 0 ? "+" : ""}${v} ${v > 0 ? "sterk" : v < 0 ? "zwak" : "evenwichtig"}` }); }),
    lens("chen", "Venster: rood = Chen-priem (p + 2 priem of een product van twee priemen), grijs = andere priem", "Feit 4015 (Chen 1966): er zijn oneindig veel priemen p waarvoor p + 2 priem is of een semipriem. De eerste priemen die géén Chen-priem zijn: 43 (45 = 3²·5), 61, 73, 79, 97. Rood = Chen-priem, grijs = niet. Rechts wat p + 2 is.", 50, venster(x => { if (!isPriem(x)) return [""]; const f = factors(x + 2); return [f.length <= 2 ? "r" : "z", `${x + 2} = ${f.join("·")}`]; }, g => isPriem(g.n) ? `${g.n + 2} = ${factors(g.n + 2).join("·")}` : "")),
    lens("superpriem", "π(n) als rode bolletjes; ✓ als π(n) priem is (n is een super-priem, als n priem is)", "Feit 4016: super-priemen zijn priemen op een priemplaats: p_(p_n) = 3, 5, 11, 17, 31, 41, 59, 67, 83, 109, 127, 157, 179, 191, 211, 241, … Elk getal boven 96 is een som van verschillende super-priemen. Rood = π(n); ✓ als π(n) priem is én n priem is. Rechts π(n).", 50, vul(g => PI[g.n], g => `${PI[g.n]}${isPriem(g.n) && isPriem(PI[g.n]) ? " ✓ super-priem" : ""}`)),
    lens("someerste", "S(n) = som van de eerste n priemen, mod n, als rode bolletjes; leeg = n deelt S(n)", "Feit 4017: S(n) = 2 + 3 + … + p_n is priem voor n = 1, 2, 4, 6, 12, 14, 60, 64, 96, 100, …, en n | S(n) alleen voor n = 1, 23, 53, 853, 11869, … Rood = S(n) mod n (+k boven 50). Rechts S(n), ✓ als S(n) priem is, en ÷ als n | S(n) (bij 23: S = 874 = 38·23 en bij 53: S = 5830 = 110·53).", 50, vul(g => { let s = 0; for (let i = 0; i < g.n; i++) s += PR[i]; return s % g.n; }, g => { let s = 0; for (let i = 0; i < g.n; i++) s += PR[i]; return `${s}${isPriem(s) ? " ✓" : ""}${s % g.n === 0 ? " ÷" : ""}`; })),
    lens("opeenvolgend", "Op hoeveel manieren is n een som van opeenvolgende priemen? (rood); 41 lukt drie keer", "Feit 4018: het kleinste getal met precies m schrijfwijzen als som van opeenvolgende priemen is 2, 5, 41, 1151 (m = 1, 2, 3, 4), en 311 heeft er al vijf. 41 = 41 = 11 + 13 + 17 = 2 + 3 + 5 + 7 + 11 + 13; in deze tabel haalt ook 240 drie manieren: 113 + 127 = 53 + 59 + 61 + 67 = 17 + 19 + … + 43. Rood = het aantal manieren; hover geeft ze. Rechts het aantal.", 50, g => { const w = []; for (let i = 0; i < PR.length && PR[i] <= g.n; i++) { let s = 0; for (let j = i; s < g.n; j++) { s += PR[j]; if (s === g.n) w.push(`${PR.slice(i, j + 1).join("+")}`); } } return { posities: w.map((_, i) => i), titels: w, waarde: w.length }; }),
  ]);

  groep("Formules", [
    lens("goldbachpoly", "Goldbachs stelling: p = kleinste priemfactor van f(n) = n² + n + 41; rood = p deelt f(n + k) (k = 49 … 0)", "Feit 5001 (Goldbach 1752): geen polynoom geeft alleen priemen, want deelt p = f(a), dan deelt p ook f(a + kp) voor elke k. Hier f(n) = n² + n + 41: neem de kleinste priemfactor p van f(n) (bij n < 40 is dat f(n) zelf); rood = p deelt f(n + k). De rode bolletjes staan periodiek, met periode p, soms met twee resten per periode. Rechts f(n) en p.", 50, plekken(0, (k, g) => { const f = x => x * x + x + 41, p = factors(f(g.n))[0]; return [f(g.n + k) % p === 0 ? "r" : "", `${p} deelt f(${g.n + k}) = ${f(g.n + k)}`]; }, g => { const v = g.n * g.n + g.n + 41; return `f = ${v} = ${factors(v).join("·")}`; })),
    lens("legendrepoly", "k² − k + n priem? (k = 50 … 1, rood); Legendres k² − k + 41 is Eulers formule verschoven", "Feit 5002: n² + n + 41 geeft 40 priemen op rij; k² − k + 41 geeft dezelfde 40 voor k = 1 … 40, en n² − 79n + 1601 geeft ze elk twee keer (80 op rij). Rood = k² − k + n is priem. Rij 41 is tot k = 40 helemaal rood, k = 41 geeft 41² en k = 42 geeft 41 · 43. Rechts het aantal rode van de 50.", 50, plekken(1, (k, g) => [isPriem(k * k - k + g.n) ? "r" : "", `${k}² − ${k} + ${g.n} = ${k * k - k + g.n}`], g => [...Array(50).keys()].filter(k => isPriem((k + 1) ** 2 - (k + 1) + g.n)).length)),
    lens("rabinowitsch", "Hoeveel priemen op rij geeft k² + k + n vanaf k = 0? (rood); ✓ bij n = 2, 3, 5, 11, 17, 41 (Rabinowitsch)", "Feit 5003 (Rabinowitsch 1913): k² + k + A is priem voor k = 0 … A − 2 precies als 4A − 1 ∈ {3, 7, 11, 19, 43, 67, 163}: de Heegner-getallen, de discriminanten met klassengetal 1 (Heegner, Stark). Rood = de lengte van de priemrun vanaf k = 0; ✓ als die run tot A − 2 reikt. Rechts de run en 4n − 1.", 50, vul(g => { let k = 0; while (k < 300 && isPriem(k * k + k + g.n)) k++; return k; }, g => { let k = 0; while (k < 300 && isPriem(k * k + k + g.n)) k++; return `${k}${k >= g.n - 1 && g.n >= 2 ? " ✓" : ""} · 4n − 1 = ${4 * g.n - 1}`; })),
    lens("bunyakovsky", "k² + n priem? (k = 49 … 0, rood); grijs = k en n beide oneven (dan is k² + n even)", "Feit 5004 (Bunyakovsky): een onontbindbaar polynoom zonder vaste priemdeler zou oneindig vaak priem moeten zijn; k² + 1 (feit 5007) is het bekendste open geval. k² + n heeft geen vaste deler, maar wel een pariteitsregel: bij oneven n zijn alleen even k kansrijk (grijs = de kansloze). Bij n = 1 zie je de priemen k² + 1. Rechts het aantal rode.", 50, plekken(0, (k, g) => [isPriem(k * k + g.n) ? "r" : k % 2 && g.n % 2 ? "z" : "", `${k}² + ${g.n} = ${k * k + g.n}`], g => [...Array(50).keys()].filter(k => isPriem(k * k + g.n)).length)),
    lens("hlkwadraat", "Hardy–Littlewood E: aantal k ≤ n met k² + 1 priem (rood) tegen de voorspelling 1,3728·Σ 1/ln(k² + 1) (grijs)", "Feit 5007: de priemen k² + 1 tot 10ᵏ zijn 5, 19, 112, 841, 6656, 54110 voor k = 1 … 6, en Hardy–Littlewoods vermoeden E voorspelt dat aantal met de constante C = ∏ (1 − (−1/p)/(p − 1)) = 1,3728 (feit 7001). Rood = de echte telling tot n, grijs = de voorspelling. Rechts beide.", 50, g => { let c = 0; for (let k = 1; k <= g.n; k++) if (isPriem(k * k + 1)) c++; const v = HL_E[g.n] || 0, posities = [...Array(Math.min(c, 50)).keys()]; return { posities, titels: posities.map(() => `${c} priemen k² + 1`), zacht: [Math.round(v) - 1], waarde: `${c} · ${v.toFixed(1)}` }; }),
    lens("tweedeverschil", "Vijf priemen vanaf n: de vier gaten als blokken van 12 (rood); ✓ als de vijf op een parabool liggen", "Feit 4011 en 5011 (Lagrange): k opeenvolgende priemen liggen altijd op een polynoom van graad k − 1, en op een lagere graad precies als de hogere verschillen verdwijnen. Hier de vier gaten tussen vijf opeenvolgende priemen vanaf n, elk als rode bolletjes in een blok van 12 (gaten boven 12 lopen over); ✓ als het derde verschil 0 is, dus de vijf priemen op één parabool liggen; in deze tabel komt dat niet voor (2, 3, 5, 7, 11 heeft gaten 1, 2, 2, 4 en derde verschil 2). Feit 4011: tot 1,4·10¹¹ is de langste run op een kwadratisch polynoom 12 priemen. Rechts de gaten.", 50, g => { if (!isPriem(g.n)) return { posities: [], titels: [] }; const ps = [g.n]; while (ps.length < 5) ps.push(volgende(ps.at(-1))); const d1 = ps.slice(1).map((p, i) => p - ps[i]), d2 = d1.slice(1).map((x, i) => x - d1[i]), d3 = d2.slice(1).map((x, i) => x - d2[i]); const posities = [], titels = []; d1.forEach((d, b) => { for (let i = 0; i < Math.min(d, 12); i++) { posities.push(b * 13 + i); titels.push(`gat ${d}`); } }); return { posities, titels, as: [12, 25, 38], waarde: `${d1.join(", ")}${d3.every(x => x === 0) ? " ✓ parabool" : ""}` }; }),
    lens("piatetski", "Venster: rood = ⌊k^1,1⌋ is priem (k = n … n−49); Piatetski-Shapiro-priemen", "Feit 5013 (Piatetski-Shapiro 1953): ⌊n^c⌋ is priem met de verwachte frequentie voor 1 < c < 1,16 (Rivat–Sargos), en oneindig vaak tot c < 1,25. Rood = ⌊k^1,1⌋ priem. Rechts ⌊n^1,1⌋ en of het priem is. De rij is wat 'dunner' dan de gewone priemen, maar het patroon blijft willekeurig.", 50, venster(x => P(Math.floor(x ** 1.1), `⌊${x}^1,1⌋ = ${Math.floor(x ** 1.1)}`), g => `⌊n^1,1⌋ = ${Math.floor(g.n ** 1.1)}${isPriem(Math.floor(g.n ** 1.1)) ? " ✓" : ""}`)),
    lens("dresslandreau", "Venster: rood = de Dress–Landreau-sextiek S(k) is priem in absolute waarde (k = n … n−49)", "Feit 9403: S(x) = x⁶/72 − 5x⁵/24 − 1493x⁴/72 + 1027x³/8 + 100471x²/18 − 11971x/6 − 57347 is in absolute waarde priem voor 58 opeenvolgende gehele x, het record voor een polynoom van graad 6; die 58 zitten bij x = −42 … 15, dus alleen de eerste rijen van deze tabel vangen ze. Wij gebruikten haar voor puzzel 1217 (half het priemgat als invoer). Rood = |S(k)| priem (PRP boven 3·10²⁴ speelt hier niet: alles blijft onder 10¹³). Rechts S(n).", 50, venster(x => { const v = dressLandreau(x); return [v !== null && bigPriem(v) ? "r" : "", `|S(${x})| = ${v}`]; }, g => { const v = dressLandreau(g.n); return v === null ? "geen geheel" : `${v}${bigPriem(v) ? " ✓" : ""}`; })),
    lens("p1230", "Venster: rood = P(k) = 5k⁴ − 330k³ + 9395k² − 130510k + 709337 is priem (k = n … n−49); 30 op rij vanaf k = 0", "Feit 9405 (puzzel 1230, ons): P(k) = 40·Q(k) + 17 geeft 30 verschillende priemen op rij voor k = 0 … 29, allemaal ≡ 17 (mod 40), dus met een even periode van 1/p (feit 9101) en twee oneven eindcijfers (feit 9102, puzzel 1135). Het record stond op 29. Rood = P(k) priem (Miller–Rabin, exact in dit bereik). Rechts P(n).", 50, venster(x => [isPriem(P1230(x)) ? "r" : "", `P(${x}) = ${P1230(x)}`], g => `${P1230(g.n)}${isPriem(P1230(g.n)) ? " ✓" : ""}`)),
