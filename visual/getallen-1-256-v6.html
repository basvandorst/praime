  groep("Tests en pseudopriemen", [
    lens("sterk", "Grondtallen a = 51 … 2: rood = sterke leugenaar (Miller–Rabin zegt 'priem'), grijs = Fermat-leugenaar, wit = getuige", "Feit 6105: de kleinste oneven samengestelde getallen die alle eerste n priemgrondtallen bedriegen zijn 2047, 1373653, 25326001, 3215031751, … Feit 6116 (Miller): onder GRH heeft elk oneven samengesteld n een getuige a < 2 ln² n. Rood = sterke leugenaar, grijs = Fermat-leugenaar maar geen sterke, wit = getuige (of a deelt n). Bij priemen is alles rood. Rechts het aantal sterke leugenaars: hoogstens een kwart (Monier–Rabin).", 50, plekken(2, (a, g) => { const n = g.n; if (n % 2 === 0 || n < 3 || a >= n || ggd(a, n) > 1) return [""]; const f = powmod(a, n - 1, n) === 1, s = f && sterkTest(a, n); return [s ? "r" : f ? "z" : "", `a = ${a}: ${s ? "sterke leugenaar" : f ? "Fermat-leugenaar" : "getuige"}`]; }, g => { const n = g.n; if (n % 2 === 0 || n < 3) return "–"; let c = 0, t = 0; for (let a = 2; a <= 51 && a < n; a++) if (ggd(a, n) === 1) { t++; if (sterkTest(a, n)) c++; } return `${c} van ${t}`; })),
    lens("korselt", "Korselt: de priemfactoren p van n (rood = p − 1 deelt n − 1, grijs = niet); Carmichael als alles rood is en n kwadraatvrij", "Feit 6103 (Korselt 1899): een samengesteld n is een Carmichael-getal (aⁿ ≡ a voor alle a) precies als n kwadraatvrij is en p − 1 | n − 1 voor elke priemfactor p. 561 = 3 · 11 · 17 is het kleinste: 2, 10 en 16 delen 560. Tot 256 bestaat er geen. Bolletje p (van rechts) is rood als p | n en p − 1 | n − 1, grijs als p | n maar niet. Rechts hoeveel factoren slagen.", 50, g => { const posities = [], titels = [], zacht = []; for (const p of g.uniek) { if ((g.n - 1) % (p - 1) === 0) { if (p <= 50) posities.push(p - 1); titels.push(`${p} − 1 deelt ${g.n} − 1`); } else if (p <= 50) zacht.push(p - 1); } return { posities, titels: titels.slice(0, posities.length), zacht, waarde: g.f.length > 1 ? `${g.uniek.filter(p => (g.n - 1) % (p - 1) === 0).length} van ${g.uniek.length}${g.uniek.length === g.f.length && g.uniek.every(p => (g.n - 1) % (p - 1) === 0) ? " Carmichael!" : ""}` : "" }; }),
    lens("lucastest", "Lucas-getallen L_k mod n (k = 50 … 1): rood = L_k ≡ 1 (mod n); bij priem n staat k = n rood", "Feit 6111: de Lucas-rij 2, 1, 3, 4, 7, 11, 18, … voldoet aan L_p ≡ 1 (mod p) voor elke priem p (Fermat voor de gulden snede). Rood = L_k ≡ 1 (mod n). Een samengesteld n met L_n ≡ 1 is een Lucas-pseudopriem (705 is de kleinste); samen met de Fermat-test wordt dit de BPSW-test (feit 6102), zonder bekend tegenvoorbeeld. Rechts L_n mod n.", 50, plekken(1, (k, g) => [lucasMod(k, g.n) === 1 % g.n ? "r" : "", `L_${k} ≡ 1 (mod ${g.n})`], g => `L_n ≡ ${lucasMod(g.n, g.n)}${lucasMod(g.n, g.n) === 1 % g.n ? " ✓" : ""}`)),
    lens("pocklington", "Pocklington met a = 2 voor priem n: de priemfactoren q van n − 1 (rood = ggd(2^((n−1)/q) − 1, n) = 1, grijs = niet)", "Feit 9301 en 6109 (Lucas, Pocklington): als 2^(n−1) ≡ 1 (mod n) en voor elke priemfactor q van n − 1 geldt ggd(2^((n−1)/q) − 1, n) = 1, dan is n priem. Met n − 1 volledig ontbonden zegt dat precies: 2 is een primitieve wortel mod n. Bolletje q (van rechts) is rood als de voorwaarde voor q lukt, grijs als niet; lukt alles, dan is a = 2 een bewijs (✓). Anders moet je een ander grondtal nemen. Rechts het oordeel.", 50, g => { const n = g.n; if (!isPriem(n) || n < 3) return { posities: [], titels: [] }; const qs = [...new Set(factors(n - 1))], posities = [], titels = [], zacht = []; let ok = powmod(2, n - 1, n) === 1; for (const q of qs) { const c = ggd((powmod(2, (n - 1) / q, n) - 1 + n) % n, n) === 1; if (!c) ok = false; if (q <= 50) (c ? posities : zacht).push(q - 1); if (c) titels.push(`q = ${q} ✓`); } return { posities, titels: titels.slice(0, posities.length), zacht, waarde: ok ? "a = 2 bewijst het ✓" : "a = 2 volstaat niet" }; }),
    lens("proth", "Proth: voor n = k·2ᵐ + 1 (k oneven < 2ᵐ): a^((n−1)/2) mod n met (a/n) = −1, geschaald; leeg = ≡ −1 = priem bewezen", "Feit 6101 (Proth 1878) en 6226: is n = k·2ᵐ + 1 met k oneven en k < 2ᵐ, dan is n priem precies als a^((n−1)/2) ≡ −1 (mod n) voor een a met (a/n) = −1; a = 3 werkt zodra (3/n) = −1, anders neem je een andere niet-rest. De Proth-priemen tot 256: 3, 5, 13, 17, 41, 97, 113, 193, 241. Hier is a de kleinste a ≥ 2 met Jacobi-symbool (a/n) = −1. Rood = de rest a^((n−1)/2) mod n, geschaald naar 50; een lege rij betekent ≡ −1, dus bewezen priem. Samengestelde Proth-getallen (9, 25, 33, 49, 57, 65, 81, 129, …) krijgen een andere rest. Rechts de uitkomst.", 50, vul(g => { const n = g.n; if (n < 3) return 0; let m = 0, k = n - 1; while (k % 2 === 0) { k /= 2; m++; } if (m === 0 || k >= 2 ** m) return 0; const a = nietRest(n); if (!a) return 0; const r = powmod(a, (n - 1) / 2, n); return r === n - 1 ? 0 : 50 * (1 - r / n); }, g => { const n = g.n; if (n < 3) return ""; let m = 0, k = n - 1; while (k % 2 === 0) { k /= 2; m++; } if (m === 0 || k >= 2 ** m) return ""; const a = nietRest(n); if (!a) return "geen niet-rest"; const r = powmod(a, (n - 1) / 2, n); return r === n - 1 ? `Proth-priem ✓ (a = ${a}, k = ${k}, m = ${m})` : `a = ${a}: rest ${r}, samengesteld`; })),
    lens("getuige", "Kleinste sterke getuige a van een oneven samengesteld n (rood); grijs = Millers GRH-grens 2 ln² n", "Feit 6116 (Miller 1976): onder de uitgebreide Riemann-hypothese heeft elk oneven samengesteld n een sterke getuige a < 2 ln² n, en daarmee is Miller–Rabin deterministisch. Rood = de kleinste getuige; hij is bijna altijd 2 (341 is het eerste getal waar 2 liegt, feit 6113). Grijs = 2 ln² n. Rechts de getuige.", 50, g => { const n = g.n; if (n % 2 === 0 || isPriem(n) || n < 9) return { posities: [], titels: [] }; const a = kleinsteGetuige(n), posities = [...Array(a).keys()]; return { posities, titels: posities.map(() => `getuige ${a}`), zacht: [Math.round(2 * Math.log(n) ** 2) - 1], waarde: `a = ${a}` }; }),
    lens("lehmer", "Lehmers totiëntprobleem: (n − 1) mod φ(n) als rode bolletjes; leeg = φ(n) deelt n − 1 (alleen priemen, voor zover bekend)", "Feit 6107 (Lehmer 1932): bestaat er een samengesteld n met φ(n) | n − 1? Niemand weet het; zo'n n zou oneven, kwadraatvrij en een Carmichael-getal met minstens 15 priemfactoren moeten zijn (en > 10²²). Rood = (n − 1) mod φ(n); een lege rij betekent φ(n) | n − 1, en dat zijn hier precies de priemen (en 1). Rechts φ(n) en de rest.", 50, vul(g => (g.n - 1) % g.phi, g => `φ = ${g.phi} · rest ${(g.n - 1) % g.phi}${(g.n - 1) % g.phi === 0 && g.n > 1 ? " ✓" : ""}`)),
    lens("giuga", "Giuga: i^(n−1) mod n voor i = 50 … 1: rood = ≡ 1; rechts Σ i^(n−1) mod n, dat −1 is precies bij priemen (vermoeden)", "Feit 1212 (Giuga 1950): n > 1 is priem precies als Σ_(i=1)^(n−1) i^(n−1) ≡ −1 (mod n), dat is het vermoeden; een tegenvoorbeeld zou tegelijk een Carmichael-getal en een Giuga-getal zijn (> 10¹³⁸⁰⁰). Bij een priem is elke term 1 (Fermat), dus de som is p − 1 ≡ −1. Rood = i^(n−1) ≡ 1 (mod n). Rechts de som mod n.", 50, plekken(1, (i, g) => [i < g.n && powmod(i, g.n - 1, g.n) === 1 ? "r" : "", `${i}^${g.n - 1} ≡ 1 (mod ${g.n})`], g => { let s = 0; for (let i = 1; i < g.n; i++) s = (s + powmod(i, g.n - 1, g.n)) % g.n; return g.n > 1 ? `${s}${s === g.n - 1 ? " ≡ −1 ✓" : ""}` : "–"; })),
    lens("perrin", "Perrin-rij 3, 0, 2, 3, 2, 5, 5, 7, 10, … : rood = n deelt P(k) (k = 50 … 1); een priem deelt P(p)", "De Perrin-rij P(k) = P(k − 2) + P(k − 3) heeft de eigenschap p | P(p) voor elke priem p (Lucas 1878, Perrin 1899), en het kleinste samengestelde getal dat dat ook doet is 271441 = 521² (Adams–Shanks 1982). Rood = n deelt P(k); het open rondje staat op k = n. Rechts P(n) mod n, ✓ als 0.", 50, plekken(1, (k, g) => [perrinMod(k, g.n) === 0 ? "r" : k === g.n ? "o" : "", `P(${k}) ≡ 0 (mod ${g.n})`], g => `P(n) ≡ ${perrinMod(g.n, g.n)}${perrinMod(g.n, g.n) === 0 ? " ✓" : ""}`)),
    lens("sarrus", "Venster: rood = 2ᵏ ≡ 2 (mod k) én k priem, grijs = 2ᵏ ≡ 2 (mod k) maar k samengesteld (Sarrus-getallen: 341 is de eerste)", "Feit 6113: 341 = 11 · 31 is de kleinste oneven samengestelde a-PRP voor a = 2 (Sarrus 1819); voor a = 3, 5, 7 zijn het 91, 217, 25. Feit 9302 (ons): een priem wordt nooit gevolgd door een even basis-2-pseudopriem (161038 is de kleinste even). Het venster toont de test 2ᵏ ≡ 2 (mod k): rood = slaagt en priem, grijs = slaagt en samengesteld (hier nooit), wit = faalt. Rechts 2ⁿ mod n.", 50, venster(x => { if (x < 2) return [""]; const ok = powmod(2, x, x) === 2 % x; return [ok && isPriem(x) ? "r" : ok ? "z" : "", `2^${x} ≡ ${powmod(2, x, x)} (mod ${x})`]; }, g => `2ⁿ ≡ ${powmod(2, g.n, g.n)} (mod n)`)),
  ]);

  groep("Uit de puzzels", [
    lens("periode40", "Periode van 1/n: rood = n deelt 10ᵏ − 1 (k = 50 … 1); ★ = n ≡ 17 (mod 40), dan is de periode even (puzzel 1230)", "Feit 9101: de periode van 1/p is de orde van 10 mod p; is (10/p) = −1, dan is die even, en dat geldt voor élke p ≡ 17 (mod 40) omdat (2/p) = 1 en (5/p) = −1. Daarop bouwden wij de 30 priemen op rij met even periode (puzzel 1230). Rood = n deelt 10ᵏ − 1; rechts de periode, ✓ = even, ★ = n ≡ 17 (mod 40).", 50, plekken(1, (k, g) => [ggd(g.n, 10) === 1 && powmod(10, k, g.n) === 1 % g.n ? "r" : "", `10^${k} ≡ 1 (mod ${g.n})`], g => { if (ggd(g.n, 10) !== 1) return "–"; const o = ordMod(10, g.n); return `${o}${o % 2 ? "" : " ✓"}${g.n % 40 === 17 ? " ★" : ""}`; })),
    lens("oneveneind", "De decimale cijfers van n (hoogste links): rood = oneven cijfer, grijs = even; ✓ als de laatste twee cijfers oneven zijn (n ≡ 17 mod 20)", "Feit 9102 (puzzel 1135): een getal ≡ 17 (mod 20) eindigt op 17, 37, 57, 77 of 97: twee oneven cijfers, dus zijn cijfers wisselen nooit netjes af tussen oneven en even. Dat gaf dezelfde formule als bij 1230 een tweede record. Rood = oneven cijfer, grijs = even cijfer. Rechts of de laatste twee cijfers oneven zijn.", 3, g => { const d = [...String(g.n)].map(Number).reverse(), posities = [], titels = [], zacht = []; d.forEach((c, i) => { if (c % 2) { posities.push(i); titels.push(`cijfer ${c}`); } else zacht.push(i); }); return { posities, titels, zacht, waarde: g.n >= 10 && d[0] % 2 && d[1] % 2 ? "✓ 17 mod 20" : "" }; }),
    lens("ongelukkig", "Venster: rood = priem én gelukkig getal, grijs = ongelukkige priem; alle getallen ≡ 5 (mod 6) zijn ongelukkig (puzzel 1209)", "Feit 9103: de tweede stap van de gelukkige zeef verwijdert precies de getallen 6k − 1, dus een getal ≡ 5 (mod 6) is nooit gelukkig. Onze formule −3x² + 2799x + 22433 ≡ 5 (mod 6) (feit 9406) gaf 34 opeenvolgende ongelukkige priemen; het record stond op 30 (een geclaimde 45 bevatte vijf gelukkige getallen). Rood = gelukkige priem, grijs = ongelukkige priem. Rechts n mod 6 en of n gelukkig is.", 50, venster(x => [isPriem(x) ? (GELUKKIG.has(x) ? "r" : "z") : "", `${x} ${GELUKKIG.has(x) ? "gelukkig" : "ongelukkig"}`], g => `${g.n % 6} (mod 6) · ${GELUKKIG.has(g.n) ? "gelukkig" : "ongelukkig"}`)),
    lens("somkwadraat", "n + q een kwadraat? voor q = 229 … 2 priem (rood); twee oneven priemen lukken alleen als ze ≡ 1 en 3 (mod 4) zijn", "Feit 9104: p + q = k² met p, q oneven priemen vereist k even, dus p + q ≡ 0 (mod 4): de een is 1, de ander 3 (mod 4). En 2 + q is alleen een kwadraat als q = k² − 2 (2 + 7 = 9, 2 + 23 = 25, 2 + 47 = 49). Rood = n + q is een kwadraat. Rechts het aantal en het eerste kwadraat.", 50, overPriemen((q, g) => [isKwadraat(g.n + q) ? "r" : "", `${g.n} + ${q} = ${Math.sqrt(g.n + q)}²`], g => { const q = P50.find(q => isKwadraat(g.n + q)); return q ? `${P50.filter(q => isKwadraat(g.n + q)).length} · ${g.n} + ${q} = ${Math.sqrt(g.n + q)}²` : "0"; })),
    lens("viertal", "Het patroon (0, 2, h, h + 2) vanaf n voor h = 100 … 2: rood = alle vier priem, grijs = h geen zesvoud (dan is het patroon niet toelaatbaar)", "Feit 9108 (puzzel 639): twee tweelingen op afstand h, {0, 2, h, h + 2}, kunnen alleen alle vier priem zijn als 6 | h (anders is een van de vier deelbaar door 3), op kleine uitzonderingen rond 3 en 5 na. Grijs = h is geen zesvoud, rood = n, n + 2, n + h, n + h + 2 zijn alle vier priem (dan staat n in een 'dubbele tweeling'). Rechts het aantal.", 50, plekken(1, (k, g) => { const h = 2 * k, ok = isPriem(g.n) && isPriem(g.n + 2) && isPriem(g.n + h) && isPriem(g.n + h + 2); return [ok ? "r" : h % 6 ? "z" : "", `h = ${h}: ${g.n}, ${g.n + 2}, ${g.n + h}, ${g.n + h + 2}`]; }, g => isPriem(g.n) && isPriem(g.n + 2) ? [...Array(50).keys()].filter(k => isPriem(g.n + 2 * k + 2) && isPriem(g.n + 2 * k + 4)).length : "")),
    lens("primoriaal19", "n + k·19# voor k = 9 … 0 (rood = priem); met d = 19# = 9699690 heeft geen term een factor ≤ 19 als ggd(n, 19#) = 1", "Feit 9109 (puzzels 1097, 1099): met verschil 19# = 9699690 en n copriem met 19# heeft geen van de tien termen n, n + d, …, n + 9d een priemfactor ≤ 19. Daarom zijn 10-termige priemrijen met dit verschil zo talrijk, en lijmden onze formules er blokken van aan elkaar. Rood = n + k·19# is priem (k = 0 … 9). Rechts het aantal van de tien; is n niet copriem met 19#, dan is de rij leeg.", 10, g => { const d = 9699690; if (ggd(g.n, d) !== 1) return { posities: [], titels: [], waarde: "ggd > 1" }; const posities = [...Array(10).keys()].filter(k => isPriem(g.n + k * d)); return { posities, titels: posities.map(k => `${g.n + k * d}`), waarde: `${posities.length} van 10` }; }),
    lens("palindroomb", "In welke basis b = 51 … 2 is n een palindroom? (rood); in basis n − 1 altijd (11)", "Feit 9112 (puzzel 75): een palindroom met een even aantal cijfers in basis b is deelbaar door b + 1, dus een priem is in geen enkele basis een palindroom met een even aantal cijfers (behalve 11 = 'bb' in basis b = 10 en, voor elke p, het palindroom '11' in basis p − 1). Rood = n is in basis b een palindroom met minstens twee cijfers; elk n ≥ 3 is 11 in basis n − 1. Rechts het aantal bases tot 51 en de eerste.", 50, plekken(2, (b, g) => { const d = cijfersBasis(g.n, b); return [d.length > 1 && d.join(",") === d.slice().reverse().join(",") ? "r" : "", `${g.n} = (${d.join(" ")})_${b}`]; }, g => { const bs = [...Array(50).keys()].map(k => k + 2).filter(b => { const d = cijfersBasis(g.n, b); return d.length > 1 && d.join(",") === d.slice().reverse().join(","); }); return bs.length ? `${bs.length} · basis ${bs[0]}` : "0"; })),
    lens("primesumsq", "k = 50 … 1: rood = n + k priem én n² + k² priem (puzzel-eis van feit 9114)", "Feit 9114 (puzzel 981): buren a, b met a + b priem en a² + b² priem; a + b kan alleen oneven priem zijn als a en b verschillende pariteit hebben, en a² + b² ≡ 1 (mod 4) vraagt hetzelfde. Zo'n rij 1 … n bestaat voor elke n ≥ 58 (en veel kleinere). Rood = k is zo'n buur van n. Rechts het aantal buren onder de 50.", 50, plekken(1, (k, g) => [isPriem(g.n + k) && isPriem(g.n * g.n + k * k) ? "r" : "", `${g.n} + ${k} = ${g.n + k}, ${g.n}² + ${k}² = ${g.n * g.n + k * k}`], g => [...Array(50).keys()].filter(k => isPriem(g.n + k + 1) && isPriem(g.n * g.n + (k + 1) ** 2)).length)),
    lens("collatzterug", "Collatz achteruit: rood = (n·2ᵏ − 1)/3 is een oneven geheel getal (k = 50 … 1), dus een voorganger van n via 3x + 1", "Feit 9115 (puzzel 476): q → p in de Collatz-rij via 3q + 1 = p·2ᵏ, dus de oneven voorgangers van n zijn (n·2ᵏ − 1)/3 voor de k waarvoor dat een oneven geheel getal is. Dat lukt precies als n ≢ 0 (mod 3), en dan voor elke tweede k. Rood = zo'n k; hover geeft de voorganger. Veelvouden van 3 hebben geen enkele voorganger via 3x + 1. Rechts het aantal.", 50, plekken(1, (k, g) => { const v = g.n * 2 ** k - 1; return [v % 3 === 0 && (v / 3) % 2 === 1 ? "r" : "", `(${g.n}·2^${k} − 1)/3 = ${v / 3}`]; }, g => g.n % 3 ? [...Array(50).keys()].filter(k => (g.n * 2 ** (k + 1) - 1) % 3 === 0 && ((g.n * 2 ** (k + 1) - 1) / 3) % 2 === 1).length : "0: 3 | n")),
    lens("evennonsq", "Even kwadraatresten r = 100 … 2 mod priem n die zelf geen kwadraat zijn (rood); grijs = even rest die wél een kwadraat is", "Feit 9801 (ons): elke priem behalve 2, 3, 5 en 11 heeft een even kwadraatrest 0 < r < p die geen perfect kwadraat is. Rood = r is even, kleiner dan p, een kwadraat mod p, en geen kwadraat in ℤ; grijs = even rest die wél een kwadraat is (4, 16, 36, 64, 100). Bij 7: 2 (3² = 9 ≡ 2) en 4; bij 11: alleen 4 → de uitzondering. Rechts de kleinste rode.", 50, plekken(1, (k, g) => { const r = 2 * k, p = g.n; if (!isPriem(p) || r >= p) return [""]; return [legendre(r, p) === 1 ? (isKwadraat(r) ? "z" : "r") : "", `${r} is een kwadraat mod ${p}`]; }, g => { const p = g.n; if (!isPriem(p)) return ""; for (let r = 2; r < p; r += 2) if (legendre(r, p) === 1 && !isKwadraat(r)) return `r = ${r}`; return "geen"; })),
  ]);

  const KNOP = {"mod6": "6k ± 1", "gat6": "Gat mod 6", "mod24": "p² − 1 en 24", "mod240": "p⁴ − 1 en 240", "tweeling6": "Tweelingen rond 6k", "germain": "Sophie Germain", "repunit": "Repunits", "kwadraatplus1": "k² + 1", "palindroom11": "Palindroom en 11", "cijfersom3": "Cijfersom en 3", "fermat": "Fermat aⁿ ≡ a", "wilson": "Wilson k!", "halffac": "Halve faculteit", "wolstenholme": "Wolstenholme", "lucas5": "Lucas mod 5", "fibonacci": "p | F_(p ± 1)", "fermatquot": "Fermat-quotiënt", "clement": "Clement", "rowland": "Rowland", "kempner": "Kempner S(n)", "eulercrit": "Euler-criterium", "nonres": "Kleinste niet-rest", "reciprociteit": "Reciprociteit", "x2y2": "x² + 2y²", "x3y2": "x² + 3y²", "nonrestrick": "Niet-rest-truc", "primwortels": "φ(p − 1) en g(p)", "orde": "Orde mod q", "drieopeen": "Drie wortels op rij", "wortelmin1": "√−1 mod n", "mersennefact": "Factoren van 2ⁿ − 1", "fermatfact": "Factoren van 2ⁿ + 1", "euler2p1": "Euler 2p + 1", "repunitfact": "Factoren van R_n", "lucaslehmer": "Lucas–Lehmer", "veelhoek": "Gauss–Wantzel", "zsigmondy32": "Zsigmondy 3ⁿ − 2ⁿ", "sylvester": "Sylvester", "polignac": "n − 2ᵏ", "machten": "Perfecte machten", "race3": "Race mod 3", "eersteprime1": "Kleinste priem ≡ 1", "linnik": "Linnik", "mertens1": "Mertens Σ 1/p", "mertens3": "Mertens ∏(1 − 1/p)", "theta": "θ(n) − n", "legendretel": "Legendre telt", "erdoskac": "Erdős–Kac", "nicolas": "Nicolas", "bruntitch": "Brun–Titchmarsh", "nagura": "Bertrand & Nagura", "andrica": "Andrica", "merit": "Merit", "erdosturan": "Stijgend of dalend", "eerstegat": "Debuut van een gat", "capelle": "Capelle", "gatproduct": "Product van gaten", "gatmod6": "Gaten mod 6", "faculteitgat": "n! + i", "oppermann": "Oppermann", "vooruit": "Vooruitvenster", "breedte": "Breedte s(k)", "brun": "Bruns constante", "ap3": "Rekenkundige drietallen", "ap4": "Rekenkundige viertallen", "evenwichtig": "Sterk, zwak, evenwichtig", "chen": "Chen-priemen", "superpriem": "Super-priemen", "someerste": "Som eerste n priemen", "opeenvolgend": "Som van opeenvolgende", "goldbachpoly": "Goldbach 1752", "legendrepoly": "k² − k + n", "rabinowitsch": "Rabinowitsch", "bunyakovsky": "k² + n", "hlkwadraat": "Hardy–Littlewood E", "tweedeverschil": "Verschillen van 5 priemen", "piatetski": "⌊k^1,1⌋", "dresslandreau": "Dress–Landreau", "p1230": "Puzzel 1230", "rotondo": "Rotondo", "sterk": "Sterke leugenaars", "korselt": "Korselt", "lucastest": "Lucas-test", "pocklington": "Pocklington", "proth": "Proth", "getuige": "Kleinste getuige", "lehmer": "Lehmer φ | n − 1", "giuga": "Giuga", "perrin": "Perrin", "sarrus": "Sarrus 2ᵏ ≡ 2", "periode40": "Periode en 17 mod 40", "oneveneind": "Oneven eindcijfers", "ongelukkig": "Ongelukkige priemen", "somkwadraat": "n + q kwadraat", "viertal": "Dubbele tweelingen", "primoriaal19": "Stap 19#", "palindroomb": "Palindroom in basis b", "primesumsq": "Priemsom en priemkwadraatsom", "collatzterug": "Collatz achteruit", "evennonsq": "Even niet-vierkante rest"};
  // ---------- knoppen en tekenen ----------
  const controls = document.getElementById("controls");
  for (const [naam, lenzen] of GROEPEN) {
    const div = document.createElement("div");
    div.innerHTML = `<span class="label">${naam}</span><div class="filter" role="group" aria-label="${naam}">${lenzen.map(id => `<button data-m="${id}" aria-pressed="false">${KNOP[id]}</button>`).join("")}</div>`;
    controls.appendChild(div);
  }
  const MAX = 50, S = 11;
  function indicator(g, modus) {
    const m = MODI[modus], plekkenAantal = Math.min(m.plekken, MAX), breedte = plekkenAantal * S, r = m.rood(g);
    let binnen, waarde = "", buiten = 0;
    if (r.vul !== undefined) {
      const zichtbaar = Math.min(r.vul, plekkenAantal); buiten = r.vul - zichtbaar;
      binnen = zichtbaar ? `<span class="fill" style="width:${zichtbaar * S}px"></span>` : "";
      waarde = `<span class="val">${r.waarde ?? r.vul}</span>`;
    } else {
      const plek = pos => `left:${breedte - (pos + 1) * S + 1}px`;
      buiten = r.posities.filter(pos => pos >= plekkenAantal).length;
      binnen = (r.as || []).filter(pos => pos >= 0 && pos < plekkenAantal).map(pos => `<span class="dot as" style="${plek(pos)}"></span>`).join("") + (r.zacht || []).filter(pos => pos >= 0 && pos < plekkenAantal).map(pos => `<span class="dot zacht" style="${plek(pos)}"></span>`).join("");
      binnen += r.posities.map((pos, i) => pos >= plekkenAantal ? "" : `<span class="dot" title="${(r.titels[i] ?? "").replace(/"/g, "'")}" style="${plek(pos)}"></span>`).join("");
      if (r.waarde !== undefined) waarde = `<span class="val">${r.waarde}</span>`;
    }
    return `<div class="ind">${waarde}<span class="meer">${buiten ? "+" + buiten : ""}</span><div class="dots" style="width:${breedte}px">${binnen}</div></div>`;
  }
  const tbody = document.getElementById("rows");
  for (const g of getallen) {
    const priem = g.f.length === 1, tr = document.createElement("tr");
    tr.dataset.priem = priem ? "ja" : "nee";
    tr.innerHTML = `<td class="num">${g.n}</td><td class="${priem ? "ja" : ""}">${priem ? "ja" : "nee"}</td><td>${g.f.length ? g.f.join(" × ") : "–"}</td><td class="num mono">${g.n.toString(2)}</td><td class="ind-cel"></td>`;
    tbody.appendChild(tr);
  }
  const filterKnoppen = document.querySelectorAll("#filter button"), modusKnoppen = document.querySelectorAll("[data-m]");
  function toonFilter(filter) {
    let shown = 0;
    for (const tr of tbody.rows) { const zichtbaar = filter === "alle" || tr.dataset.priem === filter; tr.hidden = !zichtbaar; if (zichtbaar) shown++; }
    filterKnoppen.forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));
    document.getElementById("count").textContent = `${shown} getallen`;
  }
  function toonModus(modus) {
    getallen.forEach((g, i) => { tbody.rows[i].cells[4].innerHTML = indicator(g, modus); });
    document.getElementById("ind-kop").textContent = MODI[modus].kop;
    document.getElementById("uitleg").textContent = MODI[modus].uitleg + " Maximaal 50 bolletjes; wat erbuiten valt staat als +k links ervan.";
    modusKnoppen.forEach(b => b.setAttribute("aria-pressed", b.dataset.m === modus));
  }
  filterKnoppen.forEach(b => b.addEventListener("click", () => toonFilter(b.dataset.f)));
  modusKnoppen.forEach(b => b.addEventListener("click", () => toonModus(b.dataset.m)));
  toonModus("mod6");
  toonFilter("alle");
</script>
